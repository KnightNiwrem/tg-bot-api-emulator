openapi: 3.1.1
info:
  title: tg-bot-api-emulator
  version: 0.0.0
  description: >-
    HTTP interface for isolated Telegram Bot API test sessions. Objects marked with
    `x-implementation-status: unimplemented` describe agreed API surface that is not available
    from the server yet. Marked path items without operations record routing topology only.


    Bot API paths follow Telegram's request conventions, so each listed POST operation also
    accepts GET, and method names match case-insensitively. Parameters can be supplied in the
    query string or in an `application/json`, `application/x-www-form-urlencoded`, or
    `multipart/form-data` body; a query-string parameter takes precedence over a body parameter
    of the same name. Any parameter value can be sent as text, with array parameters such as
    `allowed_updates` as JSON text. Methods that send a file read it from a `multipart/form-data`
    part with a file name: the part named after the file parameter, or the part that the
    parameter names as `attach://<part name>`. Telegram tolerates unknown parameters, malformed values, and
    bodies it cannot decode; the emulator rejects them with a `400` Bot API error so that tests
    surface the mistake.


    As on Telegram, a method the emulator does not implement is answered, after the token is
    authenticated, with a `404` Bot API error described as `Not Found: method not found`. A path
    under a session's Bot API root that does not name both a bot token and a method is answered
    with a `404` Bot API error described as `Not Found`, before any token is checked.


    The server is meant to run inside a test environment, such as CI, rather than as a public
    service, so admin routes require no credentials; each test session isolates its own state. Bot
    API routes authenticate the bot token in their path, as Telegram does, and answer a token that
    no bot of the session owns with a `401` Bot API error. OpenAPI security schemes cannot describe
    a credential in the path, so no operation declares one.
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
security: []
servers:
  - url: http://{domain}:{port}
    variables:
      domain:
        default: localhost
        description: Domain advertised to clients.
      port:
        default: '8081'
        description: Port on which the standalone server listens.
