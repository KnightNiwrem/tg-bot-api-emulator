description: >-
  Telegram Bot API method for answering a callback query the bot received. The account that
  pressed the button can read the answer from its callback query, including a URL for its
  client to open.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: answerCallbackQuery
  summary: Answer a callback query sent to the authenticated virtual bot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AnswerCallbackQueryRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/AnswerCallbackQueryRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/AnswerCallbackQueryRequest.yaml
  responses:
    '200':
      description: The answer was recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AnswerCallbackQueryResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or the callback query
        does not exist, was sent to another bot, is already answered, or has expired (`Bad
        Request: query is too old and response timeout expired or query ID is invalid`), or
        the URL does not start the bot (`Bad Request: URL_INVALID`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
