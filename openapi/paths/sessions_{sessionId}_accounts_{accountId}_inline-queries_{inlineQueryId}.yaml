description: One inline query sent by an account.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/InlineQueryId.yaml
get:
  operationId: getInlineQuery
  summary: Return an inline query with the bot's answer once given
  responses:
    '200':
      description: The inline query, answered or not.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InlineQueryResponse.yaml
    '400':
      description: The account path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '404':
      description: The session does not exist, or the account sent no such inline query.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - inline_query_not_found
                      - session_not_found
