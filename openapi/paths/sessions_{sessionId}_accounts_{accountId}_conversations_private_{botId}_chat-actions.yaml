description: The chat action, such as typing, an account's client shows in its private chat with a bot.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/BotId.yaml
get:
  operationId: getPrivateChatActions
  summary: Return the chat action the bot shows in its private chat with the account
  description: >-
    A bot's action from `sendChatAction` shows until the bot cancels it or sends a message to
    the chat. Telegram's clients also stop showing it 5.5 seconds after the bot last sent it;
    the emulator never ends it as time passes, and a test expires it through
    `chat-actions/expiry` instead.
  responses:
    '200':
      description: The bot's action, or none.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountChatActions.yaml
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '404':
      description: The session, account, or bot does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - session_not_found
