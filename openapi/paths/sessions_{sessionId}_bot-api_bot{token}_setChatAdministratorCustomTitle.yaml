description: >-
  Telegram Bot API method for setting the custom title of a supergroup administrator the bot may
  edit: one it promoted, directly or through administrators it promoted, while it holds
  `can_promote_members`. Telegram cleans the title and keeps it stripped of surrounding spaces;
  an empty or missing title removes it. Bots see the title as `custom_title` in getChatMember and
  getChatAdministrators, and members see it in the emulation API's list of administrators. As
  Telegram announces member tag changes only in basic groups, no update reports the change.
  Setting the title the administrator has changes nothing.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: setChatAdministratorCustomTitle
  summary: Set an administrator's custom title as the authenticated virtual bot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetChatAdministratorCustomTitleRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SetChatAdministratorCustomTitleRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SetChatAdministratorCustomTitleRequest.yaml
  responses:
    '200':
      description: The administrator has the given title, or none for an empty title.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or, as the official
        server's `process_set_chat_administrator_custom_title_query` checks, in this order:
        `user_id` is missing or not positive (`Bad Request: invalid user_id specified`);
        `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is neither a private
        chat with an account that has written to the bot nor a supergroup the bot is or was a
        member of (`Bad Request: chat not found`); the chat is a private chat (`Bad Request:
        method is available only in groups and supergroups`); the user is no user of the
        session (`Bad Request: member not found`); the user is the owner (`Bad Request: only
        the owner can edit their custom title`); the user is not an administrator (`Bad
        Request: user is not an administrator`); the bot may not edit the administrator (`Bad
        Request: not enough rights to change custom title of the user`); the title is not
        well-formed Unicode (`Bad Request: strings must be encoded in UTF-8`); or Telegram's
        servers refuse it, beyond 16 characters, counted by code point (`Bad Request:
        CUSTOM_TITLE_INVALID`), or with emoji (`Bad Request:
        CUSTOM_TITLE_EMOJI_NOT_ALLOWED`). A refused request changes nothing.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The bot left the supergroup (`Forbidden: bot is not a member of the
        supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
        the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
