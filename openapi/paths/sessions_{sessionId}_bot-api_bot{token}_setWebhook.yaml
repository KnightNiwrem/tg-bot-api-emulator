description: >-
  Telegram Bot API method for delivering the bot's updates to a webhook, or, with an empty URL,
  for removing it. The emulator posts each update to the URL as JSON, with the
  `X-Telegram-Bot-Api-Secret-Token` header when a secret token is set, and confirms it once the
  webhook answers with a 2xx status. As the official server's `WebhookActor` does, updates
  wait in queues: messages and their edits by chat, inline queries, chosen inline results, and
  callback queries by the sending user, poll updates by poll, membership updates by chat or by
  member, join requests by requester, and reaction and stopped generation updates by chat,
  apart from the chat's messages. Each
  queue sends one update at a time and in order, and up to `max_connections` queues send at
  once. An update the webhook has not answered after 60 seconds fails with `Read timeout
  expired`. A failed update is sent again at once, then after delays doubling from 2 up to 60
  seconds, unless the failed response's `Retry-After` header sets the wait, up to an hour, and
  holds back the later updates of its queue. As on Telegram, a 2xx response may
  call a Bot API method, named by its `method` parameter, with the response's other
  parameters in any encoding a request may use; the method runs before the queue sends its
  next update, and nothing receives its answer.
  `setWebhook`, `deleteWebhook`, `close`, `logOut`, and methods whose names start with `get`
  are ignored. Unlike Telegram, the emulator delivers to plain HTTP URLs on any port. Setting
  a new webhook
  ends the bot's waiting getUpdates request with a conflict. Ending the session stops
  delivery; undelivered updates stay pending.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: setWebhook
  summary: Set, replace, or remove the authenticated virtual bot's webhook
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetWebhookRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SetWebhookRequest.yaml
        encoding:
          allowed_updates:
            contentType: application/json
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SetWebhookRequest.yaml
        encoding:
          allowed_updates:
            contentType: application/json
  responses:
    '200':
      description: >-
        The webhook was set, removed, or already as requested. A request that changes no
        webhook still applies `allowed_updates`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SetWebhookResponse.yaml
    '400':
      description: >-
        The request body cannot be decoded, the parameters are invalid, the URL is not an HTTP
        or HTTPS URL, or the secret token is too long or has characters Telegram does not
        allow. The emulator also rejects `ip_address` and a custom `certificate`, which it
        does not support. A rejected request leaves the webhook unchanged.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
