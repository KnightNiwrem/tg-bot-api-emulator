description: Reply keyboard buttons an account pressed.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
post:
  operationId: pressReplyKeyboardButton
  summary: Press a button of the reply keyboard a private chat or a supergroup shows
  description: >-
    Sends the button's text as the account's message, as a Telegram client does. In a
    supergroup, as Telegram Desktop's `HistoryWidget::sendBotCommand` does outside private
    chats, the message replies to the keyboard's message, so that the bot that sent it
    receives it even in privacy mode. The keyboard stays shown afterward, even a one-time
    keyboard, which Telegram clients only hide until the user shows it again. A
    `request_contact` button, which only private chats show, instead shares the account's own
    contact in reply to the keyboard's message, as Telegram Desktop's `ActivateBotCommand` and
    Telegram for Android's `shareMyContact` do once the user confirms; the bot receives an
    ordinary contact message whose `user_id` is the account's. A `request_location` button
    likewise shares the `location` the request reports, as Telegram for Android's
    `sendLocation` replies with the device's location; no other button takes a location. A
    `request_users` or `request_chat` button shares the `shared_user_ids` or `shared_chat_id`
    the request chooses, as TDLib's `shareUsersWithBot` and `shareChatWithBot` do, in a
    `users_shared` or `chat_shared` service message of the account that replies to nothing.
    The choice must meet the button's criteria as TDLib's `RequestedDialogType` checks them;
    the bot must already be a member that holds the rights the request requires of it, and
    sharing grants nobody membership or rights. A `request_poll` button sends the `poll` the
    request creates, which must be of the type the button requests, if any, as the account's own
    poll that replies to nothing, as Telegram Desktop's `ActivateBotCommand` opens poll creation
    without a reply. A `web_app` button sends the `web_app_data` the request gives, as the Web
    App's `Telegram.WebApp.sendData` does, in a `web_app_data` service message of the account
    that carries the button's text and replies to nothing. The press stands for opening the Web
    App and the Web App sending its data at once, so the button must be shown when the data is
    sent; the emulator keeps no Web App open across later keyboards. When buttons share the
    pressed text, the answer selects among them: each answer selects the buttons whose request
    takes it, in any order and row, and a press without an answer selects a text or
    `request_contact` button. Buttons left that request the same thing act alike, and the first is
    pressed; buttons left that request different things, such as `request_users` buttons with
    different `request_id`s or `web_app` buttons with different links, make the press ambiguous.
    A failed press creates no message.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PressReplyKeyboardButtonRequest.yaml
  responses:
    '201':
      description: >-
        The button's text, the account's own contact, the reported location, the chosen users or
        supergroup, the created poll, or the Web App's data were sent as the account's message,
        and, unless the bot's allowed_updates subscription excludes message updates, an update was
        enqueued for the bot.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/SentMessage.yaml
              - $ref: ../components/schemas/SentSupergroupMessage.yaml
    '400':
      description: >-
        The request is invalid or answers more than one request, the chat shows no reply
        keyboard with a button of that text, an answer is missing for the button's request or
        given for a button without that request, the text and answer leave buttons that request
        different things, the chosen users or supergroup do not meet the button's criteria, the
        created poll is invalid or not of the requested type, or the Web App data is empty or
        longer than 4096 bytes in UTF-8. A request that requires Premium users, a channel, a
        forum, or an anonymous administrator cannot be answered, as the emulator models none of
        them.
    '403':
      description: >-
        The account is not a member of the supergroup it presses a button in, or may not send
        text there, as its restriction or the supergroup's default permissions decide, or is not
        a member of the supergroup it chooses to share.
    '404':
      description: >-
        The session, account, bot, or supergroup does not exist, or no account or bot of the
        session has a chosen user ID, or no supergroup of the session the chosen chat ID.
    '409':
      description: >-
        The account blocks the bot and must unblock it before writing to it, or presses a
        `request_contact` button without having a phone number.
