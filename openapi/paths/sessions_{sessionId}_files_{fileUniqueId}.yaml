description: >-
  The content of a file of the session's messages, such as a photo, document, video, voice
  note, audio file, or thumbnail, addressed by its
  `file_unique_id`, which, unlike `file_id`, is the same for every user.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/FileUniqueId.yaml
get:
  operationId: downloadFile
  summary: Return a file's content by its unique identifier
  responses:
    '200':
      description: >-
        The file's content, as it was sent, with its document's or video's MIME type, or the
        image type its photo or thumbnail was sent in.
      content:
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
    '404':
      description: The session or the file does not exist.
