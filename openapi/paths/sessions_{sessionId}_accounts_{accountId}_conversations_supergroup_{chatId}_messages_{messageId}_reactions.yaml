description: >-
  The reactions to a message of a supergroup the account is a member of, addressed by the
  message's ID in the supergroup. A message of an album is addressed through any message of the
  album: its first message that is not deleted holds the album's reactions. Deleting that message
  deletes them.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
  - $ref: ../components/parameters/SupergroupMessageId.yaml
get:
  operationId: getSupergroupMessageReactions
  summary: Read the reactions to a message of a supergroup
  description: Shows every member's reactions, the bots' included.
  responses:
    '200':
      description: The message's reactions, with the message that holds them.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupMessageReactions.yaml
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
    '404':
      description: The session, account, supergroup, or message of the supergroup does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - chat_not_found
                      - message_not_found
                      - session_not_found
put:
  operationId: setSupergroupAccountMessageReaction
  summary: React to a message of a supergroup, or change the reaction
  description: >-
    Replaces the account's reactions to the message. The supergroup's administrator bots whose
    `allowed_updates` include `message_reaction` receive a `message_reaction` update with the
    account's old and new reactions. Choosing the reactions the account already chose changes
    nothing and sends no update. Only content messages accept reactions.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetAccountMessageReactionRequest.yaml
  responses:
    '200':
      description: The message's reactions after the change, with the message that holds them.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupMessageReactions.yaml
    '400':
      description: >-
        The request is invalid, names an emoji the Bot API does not list for
        `ReactionTypeEmoji`, chooses more than one reaction, or the message is a service message.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - message_not_reactable
                          - reaction_emoji_unsupported
                          - too_many_reactions
    '403':
      description: >-
        The account is not a member of the supergroup, or lacks the `can_react_to_messages`
        permission.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - reaction_not_permitted
    '404':
      description: The session, account, supergroup, or message of the supergroup does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - chat_not_found
                      - message_not_found
                      - session_not_found
    '409':
      description: >-
        The message already shows eleven distinct reactions, Telegram's `reactions_uniq_max`, and
        the chosen one is not among them.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - too_many_distinct_reactions
delete:
  operationId: removeSupergroupAccountMessageReaction
  summary: Remove the account's reaction to a message of a supergroup
  description: >-
    As for a change, the administrator bots that subscribe to `message_reaction` receive an
    update with no new reactions. Removing without a reaction changes nothing.
  responses:
    '204':
      description: The account has no reaction to the message.
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - message_not_reactable
                          - reaction_emoji_unsupported
                          - too_many_reactions
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - reaction_not_permitted
    '404':
      description: The session, account, supergroup, or message of the supergroup does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - chat_not_found
                      - message_not_found
                      - session_not_found
