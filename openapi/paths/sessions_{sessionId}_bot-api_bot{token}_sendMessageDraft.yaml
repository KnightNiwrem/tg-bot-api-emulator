description: >-
  Telegram Bot API method for streaming the draft of a message the bot is generating to a private
  chat with an account that has written to the bot. Accounts see the draft through their
  conversation's `message-draft`, apart from the chat's messages, until the bot sends a message to
  the chat or a test expires it. A draft with `can_stop` shows a Stop button, whose press the bot
  receives as a `stopped_message_generation` update. Topics are not supported.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: sendMessageDraft
  summary: Show a draft of a message the authenticated virtual bot is generating
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendMessageDraftRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SendMessageDraftRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SendMessageDraftRequest.yaml
  responses:
    '200':
      description: The draft is shown.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or Telegram would reject it,
        checking in this order: the
        text's markup, parse mode, or entities cannot be read; `chat_id` is missing (`Bad Request:
        chat_id is empty`); the chat is not one the bot can address, as for `sendChatAction` (`Bad
        Request: chat not found`); TDLib refuses the entities, such as a mention of an unknown
        user (`Bad Request: user not found`); the chat is a supergroup (`Bad Request:
        TEXTDRAFT_PEER_INVALID`); `draft_id` is missing or zero (`Bad Request:
        RANDOM_ID_INVALID`); or the normalized text is longer than 4096 characters (`Bad Request:
        message is too long`). Telegram's servers do not document the order of their last
        checks.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The account blocks the bot (`Forbidden: bot was blocked by the user`), checked after the
        chat is known to be private; or the bot left the supergroup (`Forbidden: bot is not a
        member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
        the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
