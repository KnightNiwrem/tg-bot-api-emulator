description: >-
  Telegram Bot API method for replacing the bot's command list for a scope and language. As on
  Telegram, commands are cleaned of control characters, trimmed, and stripped of a leading
  slash, and an empty or missing `commands` list deletes the list. Chat scopes address private
  chats with accounts that have written to the bot and supergroups the bot is a member of.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: setMyCommands
  summary: Replace one of the authenticated virtual bot's command lists
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetMyCommandsRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SetMyCommandsRequest.yaml
        encoding:
          commands:
            contentType: application/json
          scope:
            contentType: application/json
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SetMyCommandsRequest.yaml
        encoding:
          commands:
            contentType: application/json
          scope:
            contentType: application/json
  responses:
    '200':
      description: The command list was replaced.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or Telegram would reject
        it, checking in this order: the scope is not a known type (`Bad Request: can't parse
        BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
        (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
        names a chat that is neither a private chat with an account that has written to the
        bot nor a supergroup the bot is or was a member of (`Bad Request: chat not found`); an administrator or member scope names a private chat
        (`Bad Request: can't use specified scope in private chats`); or the language code is
        neither empty nor two lowercase letters (`Bad Request: invalid language code
        specified`). Each command is then checked for UTF-8 text, a nonempty command of at most
        32 characters (`Bad Request: command must be non-empty`, `Bad Request: command length
        must not exceed 32`), and a nonempty description of at most 256 characters (`Bad
        Request: command description must be non-empty`, `Bad Request: command description
        length must not exceed 256`); finally, more than 100 commands (`Bad Request:
        BOT_COMMANDS_TOO_MUCH`) or a command with characters other than lowercase English
        letters, digits, and underscores (`Bad Request: BOT_COMMAND_INVALID`) are rejected.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        A chat scope names a supergroup the bot left (`Forbidden: bot is not a member of the
        supergroup chat`) or was removed from (`Forbidden: bot was kicked from the supergroup
        chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
