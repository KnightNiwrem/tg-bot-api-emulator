description: >-
  An administrator of a supergroup, as the supergroup's owner, or an administrator with
  `can_promote_members`, promotes a member or demotes it.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
  - $ref: ../components/parameters/UserId.yaml
put:
  operationId: promoteSupergroupMember
  summary: Promote a member of a supergroup to administrator as its owner or an administrator
  description: >-
    Makes the member, an account or a bot, an administrator holding the given rights, or
    replaces an administrator's rights; as on Telegram, any right includes `can_manage_chat`.
    The account must own the supergroup, or be an administrator with `can_promote_members` that
    holds every right it grants; it changes only administrators it may edit, which
    `can_be_edited` in the list of administrators shows: those it promoted, directly or through
    administrators it promoted, during administrator tenures that still last. Nobody changes the
    owner or itself. A promoted bot receives a my_chat_member update from the account showing it
    as `administrator` with its rights, and administrator bots receive a chat_member update. As
    on Telegram, an administrator bot receives every message of the supergroup, privacy mode
    notwithstanding; with `can_delete_messages` it deletes any message there, with
    `can_restrict_members` it bans, unbans, and restricts users, with `can_change_info` it
    changes the supergroup's title and description, with `can_pin_messages` it pins and unpins
    messages, with `can_invite_users` it manages its invite links and decides join requests, and
    with `can_promote_members` it promotes members with the rights it holds. Bots see the other
    rights but the emulator does not enforce them. The account becomes the administrator's promoter; promoting an administrator
    it may edit with the rights it holds changes nothing. A refused promotion changes nothing.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PromoteSupergroupMemberRequest.yaml
  responses:
    '204':
      description: The member is an administrator with the given rights.
    '400':
      description: A path identifier or the body is invalid, or the body grants no right.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - no_rights_granted
    '403':
      description: >-
        The account is not a member of the supergroup, lacks `can_promote_members`, grants a
        right it does not hold, or would change itself or an administrator it may not edit.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_not_a_member
                      - administrator_not_promoted_by_actor
                      - cannot_manage_self
                      - not_enough_rights
                      - rights_not_held
    '404':
      description: The session, account, supergroup, or user to promote does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_account_not_found
                      - chat_not_found
                      - member_not_found
                      - session_not_found
    '409':
      description: The user is not a member of the supergroup, or is its owner.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - member_is_owner
                      - not_a_member
delete:
  operationId: demoteSupergroupMember
  summary: Demote an administrator of a supergroup to a member as its owner or an administrator
  description: >-
    Makes the administrator a member without rights. The account must own the supergroup, or be
    an administrator with `can_promote_members` that may edit the administrator, as for a
    promotion. A demoted bot receives a my_chat_member update from the account showing it as
    `member`, and administrator bots receive a chat_member update. Demoting a member that is no
    administrator changes nothing.
  responses:
    '204':
      description: The user is a member of the supergroup without administrator rights.
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '403':
      description: >-
        The account is not a member of the supergroup, lacks `can_promote_members`, or would
        demote itself or an administrator it may not edit.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_not_a_member
                      - administrator_not_promoted_by_actor
                      - cannot_manage_self
                      - not_enough_rights
    '404':
      description: The session, account, supergroup, or user to demote does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_account_not_found
                      - chat_not_found
                      - member_not_found
                      - session_not_found
    '409':
      description: The user is not a member of the supergroup, or is its owner.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - member_is_owner
                      - not_a_member
