description: Whether a supergroup message is pinned, addressed by the supergroup's message ID.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
  - $ref: ../components/parameters/SupergroupMessageId.yaml
put:
  operationId: pinSupergroupMessage
  summary: Pin a message of the supergroup
  description: >-
    Adds a message to the supergroup's pinned messages; a supergroup pins any number of
    messages. The account needs the `can_pin_messages` permission: the owner holds it, an
    administrator holds it with that right or as the default permissions grant it, and any
    other member as the default permissions and its restriction grant it. A public supergroup
    ignores its default permissions for pins, as the Bot API documents, so only the owner and
    administrators with the right pin there. The pin is recorded as the account's service
    message with `pinned_message`, which notifies the members and which every bot of the
    supergroup subscribed to `message` updates receives. Unpinning records nothing.
  responses:
    '204':
      description: The message was pinned.
    '400':
      description: A path identifier is invalid, or the message is a service message.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - service_message_not_pinnable
    '403':
      description: The account is not a member, or lacks the `can_pin_messages` permission.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - not_enough_rights
    '404':
      description: The session, account, supergroup, or message does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - chat_not_found
                      - message_not_found
                      - pinner_not_found
                      - session_not_found
    '409':
      description: The message is already pinned, which Telegram refuses as not modified.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - bot_blocked
                      - message_already_pinned
delete:
  operationId: unpinSupergroupMessage
  summary: Unpin a message of the supergroup
  description: Removes a pinned message, which needs the same permission as pinning it.
  responses:
    '204':
      description: The message was unpinned.
    '400':
      description: A path identifier is invalid, or the message is a service message.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - service_message_not_pinnable
    '403':
      description: The account is not a member, or lacks the `can_pin_messages` permission.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - not_enough_rights
    '404':
      description: The session, account, supergroup, or message does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - chat_not_found
                      - message_not_found
                      - pinner_not_found
                      - session_not_found
    '409':
      description: The message is not pinned, which Telegram refuses as not modified.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - bot_blocked
                      - message_not_pinned
