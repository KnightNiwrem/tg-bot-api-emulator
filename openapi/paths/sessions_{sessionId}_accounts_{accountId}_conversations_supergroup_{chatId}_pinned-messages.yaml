description: The messages a supergroup the account is a member of pins.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
get:
  operationId: getSupergroupPinnedMessages
  summary: Return the supergroup's pinned messages
  description: >-
    Returns the messages the supergroup pins, newest first by sending date, as the account sees
    them; every member sees the same pinned messages. The first is the `pinned_message` that
    `getChat` shows. Deleting a message unpins it.
  responses:
    '200':
      description: The account is a member; the message list may be empty.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupMessageHistory.yaml
    '400':
      description: An account or supergroup path identifier is invalid.
    '403':
      description: The account is not a member of the supergroup.
    '404':
      description: The session, account, or supergroup does not exist.
