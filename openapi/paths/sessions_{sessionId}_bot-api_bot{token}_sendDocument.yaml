description: >-
  Telegram Bot API method for sending a file as a document with an optional caption, as
  `sendPhoto` sends a photo. The Bot API server cleans the name of an uploaded file, and the
  name's extension decides the document's MIME type. Telegram sends some files, such as videos
  and GIF animations, as other media unless `disable_content_type_detection` is set; the
  emulator always sends a document. An uploaded `thumbnail` is kept as the document's
  thumbnail, as described for that parameter. A document sent by HTTP URL is downloaded as
  `sendPhoto` downloads a photo. Telegram documents that only PDF and ZIP files can be sent by URL;
  the emulator requires the response to be served as `application/pdf` or `application/zip`,
  without inspecting its content, and to be at most 20 MB (20971520 bytes). It is named after
  the URL's last path segment and keeps no thumbnail.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: sendDocument
  summary: Send a document from the authenticated virtual bot to an account or a supergroup
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SendDocumentRequest.yaml
        encoding:
          caption_entities:
            contentType: application/json
          reply_parameters:
            contentType: application/json
          reply_markup:
            contentType: application/json
      application/json:
        schema:
          $ref: ../components/schemas/SendDocumentRequest.yaml
  responses:
    '200':
      description: >-
        The document was stored in the private conversation or supergroup. No bot receives an
        update for a bot's message.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MessageResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or Telegram would reject
        it for the reasons `sendPhoto` gives, apart from those about images: the request names
        no file (`Bad Request: there is no document in the request`), the uploaded file is
        empty or, in a session with the `local` upload profile, larger than 2097152000 bytes
        (`Bad Request: file of size <size> bytes is too big; the maximum size is 2097152000
        bytes`), the document sent by URL fails as for `sendPhoto`, with its own limits, or the
        `file_id` identifies no file the bot knows or identifies a file of another type (`Bad
        Request: can't use file of type Photo as Document`). TDLib accepts the `file_id` of a
        video and leaves Telegram's servers to decide what the message shows; the emulator
        refuses it (`Bad Request: can't use file of type Video as Document`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
        the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
        from it (`Forbidden: bot was kicked from the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '413':
      $ref: ../components/responses/BotApiUploadTooLarge.yaml
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
