description: >-
  Telegram Bot API method for leaving a supergroup the bot is a member of. The bot receives a
  my_chat_member update from itself, from its status to `left`, or, as TDLib's `leave_dialog`
  asks, from `restricted` to `restricted` with `is_member` false for a restricted bot, and then
  the service message from itself that records the change with `left_chat_member`, which, as a
  service message, the supergroup's other bots receive too. The bot's later requests to the
  supergroup fail with `403 Forbidden: bot is not a member of the supergroup chat`, except that
  it may still read a public supergroup, as for getChat.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: leaveChat
  summary: Leave a supergroup as the authenticated virtual bot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LeaveChatRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/LeaveChatRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/LeaveChatRequest.yaml
  responses:
    '200':
      description: The bot left the supergroup.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or Telegram would reject
        it: `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is a private chat
        with an account that has written to the bot (`Bad Request: can't leave private
        chats`); or the chat is neither that nor a supergroup the bot is or was a member of
        (`Bad Request: chat not found`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The bot already left the supergroup (`Forbidden: bot is not a member of the supergroup
        chat`) or was removed from it (`Forbidden: bot was kicked from the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
