description: >-
  The session's bot activity log: the Bot API calls its bots make, with their answers, and the
  updates delivered to and confirmed by them. Entries are positioned in the order the emulator
  decided each outcome, which agrees with every order a bot enforces: a bot that awaits one call's
  answer before making another call cannot have the second recorded first, and a call made while
  handling an update is recorded after the update's delivery. Calls a bot makes concurrently may
  be recorded in either order.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
get:
  operationId: readBotActivity
  summary: Read, or wait for, entries of the session's bot activity log
  description: >-
    Answers with the earliest entries after `after`, and before `before` if given, that match
    every filter given. Filters that only calls have, `method`, `ok`, `parameters` and
    `parameters_json`, match no update entry, and filters that only updates have, `user_id` and
    `update_id`, match no call. A
    read without `before` that finds no matching entry is held until one is recorded, `wait_ms`
    elapses, or the session ends. A read with `before` covers a range that is already complete and
    is answered at once.
  parameters:
    - name: after
      in: query
      description: Only entries after this position are read; 0 reads from the first entry.
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: before
      in: query
      description: >-
        Only entries before this position are read. It must be greater than `after` and at most 1
        greater than the head position.
      schema:
        type: integer
        minimum: 1
    - name: bot_id
      in: query
      schema:
        $ref: ../components/schemas/TelegramUserId.yaml
    - name: kind
      in: query
      schema:
        type: string
        enum:
          - bot_api_call
          - update_delivered
          - update_confirmed
          - webhook_attempt_failed
    - name: method
      in: query
      description: >-
        A method name, compared without regard to letter case; a method's older name finds its
        calls too.
      schema:
        type: string
        minLength: 1
    - name: chat_id
      in: query
      schema:
        type: integer
    - name: user_id
      in: query
      schema:
        type: integer
    - name: update_id
      in: query
      description: >-
        The ID of the update delivered, confirmed, or failed to be delivered. Each bot numbers its
        updates independently, so an ID names one update only together with `bot_id`.
      schema:
        type: integer
    - name: ok
      in: query
      description: Whether the call's answer was successful.
      schema:
        type: boolean
    - name: parameters
      in: query
      style: deepObject
      explode: true
      description: >-
        Parameter text a call must have sent, by parameter name, compared exactly with the text
        the call sent: `parameters[callback_query_id]=123`. Text that happens to be JSON is
        compared as text, so `parameters[reply_parameters]={"message_id":5}` finds only calls
        that sent those exact characters; `parameters_json` compares JSON by its structure.
      schema:
        type: object
        additionalProperties:
          type: string
    - name: parameters_json
      in: query
      description: >-
        A JSON object of patterns, by parameter name, that the JSON a call sent in each named
        parameter must match: `parameters_json={"reply_parameters":{"message_id":5}}`, URL-encoded.
        A call matches when, for every member, it sent that parameter, the parameter's text is
        JSON, and that JSON matches the member's pattern, which must be an object or an array.
        Within a pattern, a string, number or boolean matches the same value of the same type, so
        `5` matches neither `"5"` nor `true`, and `1` matches `1.0`; `null` matches only `null`,
        not a missing member; an object matches an object that has every member the pattern
        names, with a matching value, whatever other members it has and in any order, so no
        pattern requires a member to be missing; an array matches an array of the same length
        whose elements match the pattern's in order. A parameter a bot sent as a JSON body's
        object or array is matched just as one it sent as that JSON's text. The value is rejected
        when it is not JSON, nests objects and arrays more than 100 levels deep, its own object
        included, is not an object, has a member that is not an object or an array, or has an
        object that names a member more than once.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type:
                - object
                - array
    - name: limit
      in: query
      description: The most entries to answer with; 0 answers only with the head position.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 100
    - name: wait_ms
      in: query
      description: >-
        How long, in milliseconds, a read that finds no matching entry is held. Not allowed with
        `before`.
      schema:
        type: integer
        minimum: 0
        maximum: 600000
        default: 0
  responses:
    '200':
      description: The matching entries, oldest first, and the latest position.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - entries
              - head_position
            properties:
              entries:
                type: array
                items:
                  $ref: ../components/schemas/BotActivityEntry.yaml
              head_position:
                type: integer
                minimum: 0
                description: >-
                  The position of the latest entry when the read was answered; 0 while the log is
                  empty.
    '400':
      description: >-
        The query has an unknown, repeated, or malformed parameter, `parameters_json` is not an
        object of patterns, nests more than 100 levels deep or names a member twice, `before` is
        not greater than `after`, `wait_ms` is given with `before`, or a position is beyond the
        head of the log.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - after_beyond_head
                          - before_beyond_head
    '404':
      description: No active test session has the supplied identifier.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - session_not_found
