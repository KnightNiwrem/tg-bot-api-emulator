description: Messages sent by one virtual account.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
post:
  operationId: sendAccountMessage
  summary: Send a message as a virtual account
  description: >-
    Sends text, a photo, a document, a video, a voice note, an audio file, a contact, a static
    location, or a new poll to the account's private chat with a bot, or to a supergroup the account is a member of;
    or forwards a message of such a chat there, as the account's message that shows who first sent
    it. A contact the account writes shows no Telegram user, while its own contact shows the
    account as its user. A poll is the account's own, which only it stops, and about which no bot
    receives `poll` or `poll_answer` updates. Messages protected from forwarding and
    service messages cannot be forwarded, and, as on Telegram, a forward cannot be edited. In
    a supergroup, the supergroup's bots receive the message unless it is not addressed to a
    bot in privacy mode. As on Telegram, a message reaches only the one bot in privacy mode it
    is meant for, if any, and replies take precedence: the bot a replied message was meant
    for (its author, the bot it was sent through, or the bot it was meant for in turn), then
    the bot the message is sent through, then the bot its leading command names. Only a
    message meant for no bot in particular reaches bots in privacy mode that it mentions, and,
    when its text or caption starts with a command without a bot's username, the bot that last
    sent a message to the supergroup if that bot is in privacy mode; before any bot has sent
    one, the emulator delivers such a command to every bot in privacy mode. As on Telegram, a
    bot that is an administrator of the supergroup receives every message, privacy mode
    notwithstanding.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendAccountMessageRequest.yaml
  responses:
    '201':
      description: >-
        The message was stored and, unless a receiving bot's allowed_updates subscription
        excludes message updates, an update was enqueued for each bot that receives it.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/SentMessage.yaml
              - $ref: ../components/schemas/SentSupergroupMessage.yaml
    '400':
      description: >-
        The request, message text, caption, or poll is invalid, the photo is not an image
        Telegram accepts, the file is empty, the replied message is not a message of the chat, or
        the forwarded message cannot be forwarded.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - bot_upload_too_big
                          - caption_too_long
                          - file_empty
                          - image_invalid
                          - message_not_forwardable
                          - message_text_empty
                          - message_text_too_long
                          - photo_dimensions_invalid
                          - photo_too_big
                          - poll_has_too_many_options
                          - poll_option_too_long
                          - poll_options_missing
                          - poll_question_too_long
                          - quiz_correct_option_not_found
                          - quiz_correct_options_missing
                          - quiz_correct_options_not_increasing
                          - quiz_explanation_has_too_many_line_feeds
                          - quiz_explanation_too_long
                          - reply_message_not_found
                          - text_invalid
    '403':
      description: >-
        The account is not a member of a supergroup of the request, or may not send the content,
        or the forwarded message's content, there, as its restriction or the supergroup's
        default permissions decide.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - send_permission_missing
    '404':
      description: >-
        The session, sending account, a bot or supergroup of the request, or the forwarded
        message does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - message_not_found
                      - session_not_found
    '409':
      description: >-
        The account blocks the target bot and must unblock it before writing to it, or shares its
        own contact without having a phone number.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_phone_number_missing
                      - bot_blocked
