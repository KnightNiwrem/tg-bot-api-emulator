description: >-
  Telegram Bot API method for choosing the menu button of all the bot's private chats, or with
  `chat_id` of its chat with one account. A missing or empty `menu_button` is the default
  button, which removes the choice. As in TDLib, a Web App button's text and URL are cleaned
  of control characters and its URL, which must be a valid HTTPS link, is stored normalized.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: setChatMenuButton
  summary: Choose the authenticated virtual bot's menu button
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetChatMenuButtonRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SetChatMenuButtonRequest.yaml
        encoding:
          menu_button:
            contentType: application/json
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SetChatMenuButtonRequest.yaml
        encoding:
          menu_button:
            contentType: application/json
  responses:
    '200':
      description: The menu button was chosen.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, including unknown button
        fields, or Telegram would reject it, checking in this order: `menu_button` is not
        JSON (`Bad Request: can't parse menu button JSON object`), not a JSON object (`Bad
        Request: can't parse menu button: MenuButton must be an Object`), lacks a field (`Bad
        Request: can't parse menu button: Can't find field "<field>"`), has a `web_app` that
        is not an object (`Bad Request: can't parse menu button: Field "web_app" must be of
        type Object`), or has another type (`Bad Request: can't parse menu button: MenuButton
        has unsupported type`); `chat_id` is not positive (`Bad Request: invalid chat_id
        specified`) or names no account (`Bad Request: user not found`); a Web App button's
        text is empty (`Bad Request: menu button text must be non-empty`), its text or URL is
        not well-formed Unicode (`Bad Request: menu button text must be encoded in UTF-8`,
        `Bad Request: menu button URL must be encoded in UTF-8`), or its URL is not a valid
        HTTPS link (`Bad Request: menu button Web App URL '<url>' is invalid: <reason>`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
