description: One isolated Telegram test session and the lifecycle of everything it owns.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
delete:
  operationId: deleteSession
  summary: End an isolated test session
  description: >-
    Discards the session and all virtual entities and state that it owns. Long polls that its bots
    hold are answered at once without updates.
  responses:
    '204':
      description: The test session and all of its state were discarded.
    '404':
      description: No active test session has the supplied identifier.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - session_not_found
