description: >-
  The account's uses of invite links, each of which joins the supergroup a link leads to, or
  requests to join it.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
post:
  operationId: joinChatByInviteLink
  summary: Join the supergroup an invite link leads to, or request to join it
  description: >-
    Joins the supergroup as Telegram's clients do with an invite link: the link must be one of
    the session's and not revoked, a test must not have made its expiry date arrive, and its
    member limit must leave a place, counting the members that joined through it and still are.
    The link's settings are those of its last edit. A restricted user
    joins with its restriction. A service message from the account records the join with
    `new_chat_members`, which every bot of the supergroup receives, privacy mode
    notwithstanding; administrator bots subscribed to `chat_member` receive the change with the
    link, the whole link only if they created it. The membership takes a place of the link's
    member limit until it ends.


    A link that creates join requests leaves the account outside and stores its request, as
    Telegram answers `INVITE_REQUEST_SENT`. The supergroup's administrator bots holding
    `can_invite_users` receive it as a `chat_join_request` update, and any of them approves or
    declines it. An account has one pending request per supergroup, which also ends when it
    joins another way or is banned.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/JoinChatByInviteLinkRequest.yaml
  responses:
    '200':
      description: The account joined the supergroup, or sent a request to join it.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ChatJoinResponse.yaml
    '400':
      description: The account path identifier or the request body is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '403':
      description: The account is banned from the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - banned
    '404':
      description: The session, the account, or an invite link of the session does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - invite_link_not_found
                      - session_not_found
    '409':
      description: >-
        The account is a member of the supergroup already, or its request to join it is pending.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - already_a_member
                      - join_request_pending
    '410':
      description: >-
        The bot that created the link revoked it, a test made its expiry date arrive, or as many
        users as its member limit allows joined through it and are members.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - invite_link_expired
                      - invite_link_member_limit_reached
                      - invite_link_revoked
