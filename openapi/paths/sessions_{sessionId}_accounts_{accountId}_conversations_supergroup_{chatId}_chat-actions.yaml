description: The chat actions, such as typing, a member's client shows in a supergroup.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
get:
  operationId: getSupergroupChatActions
  summary: Return the chat actions the supergroup's bots show
  description: >-
    Returns each bot's action in the order the bots last sent them. As for a private chat, an
    action shows until the bot cancels it or sends a message to the supergroup, or until a test
    expires it through `chat-actions/{botId}/expiry`; it never ends as time passes.
  responses:
    '200':
      description: The bots' actions, which may be none.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountChatActions.yaml
    '400':
      description: An account or supergroup path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
    '404':
      description: The session, account, or supergroup does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - session_not_found
