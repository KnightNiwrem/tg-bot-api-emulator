description: >-
  Telegram Bot API method for creating an additional invite link of a supergroup. The bot needs
  the `can_invite_users` administrator right, which default permissions never grant a bot. The
  link keeps its creator, name, expiry date, member limit, and whether it creates join requests;
  accounts use it through the emulation API, and administrator bots subscribed to `chat_member`
  see it in the update for a member that joined through it, the whole link only if they created
  it. A link that creates join requests sends administrator bots holding `can_invite_users` a
  `chat_join_request` update for each account that uses it. Editing, revoking, and exporting links
  are not supported.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: createChatInviteLink
  summary: Create an invite link of a supergroup as the authenticated virtual bot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateChatInviteLinkRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/CreateChatInviteLinkRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/CreateChatInviteLinkRequest.yaml
  responses:
    '200':
      description: The new link, as its creator sees it.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ChatInviteLinkResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded, has unsupported parameters, or has a negative
        `expire_date` or `member_limit`, which Telegram would read as zero (`Bad Request: invalid
        createChatInviteLink parameters`), or Telegram would reject it, in this order: `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is
        neither a private chat with an account that has written to the bot nor a supergroup the
        bot is or was a member of (`Bad Request: chat not found`); the chat is a private chat
        (`Bad Request: can't invite members to a private chat`); the name is not well-formed
        Unicode (`Bad Request: strings must be encoded in UTF-8`); the link creates join requests
        and has a member limit (`Bad Request: member limit can't be specified for links requiring
        administrator approval`); the bot lacks `can_invite_users` (`Bad Request: not enough
        rights to manage chat invite link`); the expiry date is not in the future (`Bad Request:
        EXPIRE_DATE_INVALID`); or the member limit exceeds 99999 (`Bad Request:
        USAGE_LIMIT_INVALID`). A refused request creates no link.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The bot left the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or
        was removed from it (`Forbidden: bot was kicked from the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
