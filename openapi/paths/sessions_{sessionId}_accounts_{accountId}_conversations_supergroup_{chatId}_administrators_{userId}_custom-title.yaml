description: >-
  The custom title that clients show for the owner of a supergroup or an administrator in place
  of its role.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
  - $ref: ../components/parameters/UserId.yaml
put:
  operationId: setSupergroupCustomTitle
  summary: Set the custom title of the owner or an administrator of a supergroup the account owns
  description: >-
    Sets the owner's own custom title or an administrator's, as Telegram lets a supergroup's
    owner do; an empty title removes it. Telegram cleans the title and keeps it stripped of
    surrounding spaces, as a bot's titles are. Bots see the title as `custom_title` in getChatMember,
    getChatAdministrators, and chat member updates, and a bot whose title changes receives a
    my_chat_member update. An administrator keeps its title when its rights change, and loses
    it when demoted. Setting the title a user has changes nothing.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetCustomTitleRequest.yaml
  responses:
    '204':
      description: The user has the given title, or none for an empty title.
    '400':
      description: >-
        A path identifier or the body is invalid, or the title is not well-formed Unicode, is
        longer than 16 Unicode code points, or has emoji. These title checks follow the account's
        ownership of the supergroup and the user's standing.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - custom_title_contains_emoji
                          - custom_title_too_long
                          - text_encoding_invalid
    '403':
      description: The account does not own the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_not_authorized
    '404':
      description: The session, account, supergroup, or user does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - actor_account_not_found
                      - chat_not_found
                      - member_not_found
                      - session_not_found
    '409':
      description: The user is not the owner or an administrator of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
                      - not_an_administrator
