description: >-
  Telegram Bot API method for sending a video with an optional caption, as `sendPhoto` sends a
  photo. The video's duration, width and height are those the bot specifies, as the Bot API
  documents them as defined by the sender; the emulator never reads video content, so it sends
  any content as a video, while Telegram documents that its clients play MPEG-4 videos and that
  it may send other formats as documents. The Bot API server cleans the name of an uploaded
  file; the MIME type is the `video/` type its extension decides, or else `video/mp4`, as TDLib
  uploads a video. An uploaded `thumbnail` is kept as for `sendDocument`. A video sent by
  `file_id` keeps its own attributes and thumbnail. A video sent by HTTP URL is downloaded as
  `sendPhoto` downloads a photo; the emulator requires it to be served as `video/mp4` and to be
  at most 20 MB (20971520 bytes), names it after the URL's last path segment, if any, keeps the
  attributes the bot specified, and gives it no thumbnail. A `cover` is not supported.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: sendVideo
  summary: Send a video from the authenticated virtual bot to an account or a supergroup
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SendVideoRequest.yaml
        encoding:
          caption_entities:
            contentType: application/json
          reply_parameters:
            contentType: application/json
          reply_markup:
            contentType: application/json
      application/json:
        schema:
          $ref: ../components/schemas/SendVideoRequest.yaml
  responses:
    '200':
      description: >-
        The video was stored in the private conversation or supergroup. No bot receives an
        update for a bot's message.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MessageResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, such as `cover`, or
        Telegram would reject it for the reasons `sendDocument` gives: the request names no file
        (`Bad Request: there is no video in the request`), the uploaded file is empty or, in a
        session with the `local` upload profile, larger than 2097152000 bytes, the video sent by
        URL cannot be downloaded within its limit or is not served as `video/mp4`, or the
        `file_id` identifies no file the bot knows or a file of another type (`Bad Request:
        can't use file of type Document as Video`). TDLib accepts the `file_id` of a document or
        another file of its document class and leaves Telegram's servers to decide what the
        message shows; the emulator refuses it instead.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
        the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
        from it (`Forbidden: bot was kicked from the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '413':
      $ref: ../components/responses/BotApiUploadTooLarge.yaml
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
