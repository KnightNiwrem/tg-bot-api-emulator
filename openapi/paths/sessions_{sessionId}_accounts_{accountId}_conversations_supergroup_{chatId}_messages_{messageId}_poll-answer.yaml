description: >-
  The account's answer to the poll a message of a supergroup shows, addressed by the message's ID
  in the supergroup, as for a private chat.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
  - $ref: ../components/parameters/SupergroupMessageId.yaml
get:
  operationId: getSupergroupAccountPollAnswer
  summary: Read the account's answer to a poll of a supergroup
  responses:
    '200':
      description: >-
        The account's answer, empty without one, with the message showing the poll and its
        votes.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupPollAnswerResponse.yaml
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ControlValidationError.yaml
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
    '404':
      description: >-
        The session, account, supergroup, or message of the supergroup does not exist, or the
        message shows no poll.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - message_has_no_poll
                      - message_not_found
                      - session_not_found
put:
  operationId: answerSupergroupAccountPoll
  summary: Vote in a poll of a supergroup, or change the vote
  description: As for a poll of a private chat.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetPollAnswerRequest.yaml
  responses:
    '200':
      description: The account's answer, with the message showing the poll and its votes.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupPollAnswerResponse.yaml
    '400':
      description: >-
        The request is invalid, chooses several options of a poll that allows one, or names an
        option the poll lacks.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - multiple_answers_not_allowed
                          - poll_option_not_found
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
    '404':
      description: >-
        The session, account, supergroup, or message of the supergroup does not exist, or the
        message shows no poll.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - message_has_no_poll
                      - message_not_found
                      - session_not_found
    '409':
      description: >-
        The poll is closed, or disallows revoting and the account has answered.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - answer_change_not_allowed
                      - answer_retraction_not_allowed
                      - poll_closed
delete:
  operationId: retractSupergroupAccountPollAnswer
  summary: Retract the account's answer to a poll of a supergroup
  description: As for a poll of a private chat.
  responses:
    '204':
      description: The account has no answer to the poll.
    '400':
      description: A path identifier is invalid.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/ControlValidationError.yaml
              - allOf:
                  - $ref: ../components/schemas/ControlError.yaml
                  - properties:
                      reason:
                        enum:
                          - multiple_answers_not_allowed
                          - poll_option_not_found
    '403':
      description: The account is not a member of the supergroup.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - not_a_member
    '404':
      description: >-
        The session, account, supergroup, or message of the supergroup does not exist, or the
        message shows no poll.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - account_not_found
                      - bot_not_found
                      - chat_not_found
                      - message_has_no_poll
                      - message_not_found
                      - session_not_found
    '409':
      description: The poll is closed, or disallows revoting.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/ControlError.yaml
              - properties:
                  reason:
                    enum:
                      - answer_change_not_allowed
                      - answer_retraction_not_allowed
                      - poll_closed
