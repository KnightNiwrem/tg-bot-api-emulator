description: >-
  Telegram Bot API method for changing the description of a supergroup, which bots then see in
  `getChat`. As TDLib's `set_channel_description` does, the description is cleaned and needs
  the bot to be an administrator with `can_change_info`; an empty description removes it. No
  service message records the change.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: setChatDescription
  summary: Change the description of a supergroup as the authenticated virtual bot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetChatDescriptionRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/SetChatDescriptionRequest.yaml
      multipart/form-data:
        schema:
          $ref: ../components/schemas/SetChatDescriptionRequest.yaml
  responses:
    '200':
      description: The supergroup has the new description.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TrueResultResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, or Telegram would reject
        it: `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is not found
        (`Bad Request: chat not found`); the chat is a private chat with an account that has
        written to the bot (`Bad Request: can't change private chat description`); the bot
        lacks the right (`Bad Request: not enough rights to set chat description`); or the
        supergroup already has the description, which Telegram's servers refuse (`Bad Request:
        chat description is not modified`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The bot left the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or
        was removed from it (`Forbidden: bot was kicked from the supergroup chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
