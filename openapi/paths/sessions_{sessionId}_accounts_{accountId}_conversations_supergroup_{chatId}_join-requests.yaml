description: The pending join requests of a supergroup the account owns.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
get:
  operationId: getSupergroupJoinRequests
  summary: Return the pending requests to join the supergroup, as its owner sees them
  description: >-
    Lists the requests that accounts sent through invite links that create join requests, in the
    order they were sent. A request ends when an administrator bot or account approves or
    declines it, or when its account joins another way or is banned.
    Only the owner sees them, as only it sees the invite links they were sent through.
  responses:
    '200':
      description: The pending join requests of the supergroup.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupJoinRequests.yaml
    '400':
      description: An account or supergroup path identifier is invalid.
    '403':
      description: The account does not own the supergroup.
    '404':
      description: The session, account, or supergroup does not exist.
