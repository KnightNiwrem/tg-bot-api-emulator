description: >-
  Telegram Bot API method for replacing the content of a message the bot sent to a private chat
  or a supergroup with a new photo, document, video, or audio file and its caption. As TDLib's
  `edit_message_media` allows, a photo, document, video, or audio message changes its media, and
  a text or rich message becomes media; the old caption goes with the old content. In an album, a
  photo and a video replace each other, while a document or an audio file neither becomes nor
  replaces other media. As
  on Telegram, the edited message keeps only the inline keyboard given in `reply_markup`, and the
  bot receives no update for its own edit. Without `chat_id` and `message_id`, the method edits a
  message an account sent through the bot's inline mode, which `inline_message_id` identifies,
  as `editMessageText` does; as TDLib requires, such a message's new media must reuse a file by
  its `file_id` or name one by HTTP URL, and an upload fails (`Bad Request: invalid message
  content specified`).
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/BotToken.yaml
post:
  operationId: editMessageMedia
  summary: Replace the media of a message the authenticated virtual bot sent
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EditMessageMediaRequest.yaml
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/EditMessageMediaRequest.yaml
        encoding:
          media:
            contentType: application/json
          reply_markup:
            contentType: application/json
      multipart/form-data:
        schema:
          $ref: ../components/schemas/EditMessageMediaRequest.yaml
        encoding:
          media:
            contentType: application/json
          reply_markup:
            contentType: application/json
  responses:
    '200':
      description: >-
        The message was edited: the edited message for a message of a chat, or `true` for an
        inline message.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EditMessageResponse.yaml
    '400':
      description: >-
        The request cannot be decoded or has unsupported parameters, the `media` parameter is
        missing (`Bad Request: parameter "media" is required`) or cannot be read as the
        `InputMedia` schema describes, the file cannot be sent as for `sendPhoto`, `sendDocument`,
        `sendVideo` and `sendAudio`, or Telegram would reject the edit for the reasons `editMessageCaption`
        gives, apart from the message's kind: any message the bot can edit can take new media,
        except that the media of a voice note or a poll cannot be edited (`Bad Request: message
        media can't be edited`), as TDLib's `can_edit_message_media` decides, and a document or an
        audio file of an album cannot become other media, nor other media a document or an audio
        file (`Bad Request: can't change media type in the album`). A `voice_note` cannot be new media either, as the
        official server refuses it outside rich messages (`Bad Request: can't parse InputMedia:
        type "voice_note" is not allowed`). As TDLib's `edit_message_media` checks new media
        with `can_send_message_content`, a bot may not put media it may not send into a message
        of a supergroup (`Bad Request: not enough rights to send photos to the chat`, or the like
        for documents and videos, and `Bad Request: not enough rights to send music to the chat`
        for audio files); a message addressed by `inline_message_id` is not checked.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '401':
      description: The token does not belong to a virtual bot in the addressed session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '403':
      description: >-
        The chat is a supergroup that the bot left (`Forbidden: bot is not a member of the
        supergroup chat`) or was removed from (`Forbidden: bot was kicked from the supergroup
        chat`).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotApiErrorResponse.yaml
    '404':
      description: No active test session has the supplied identifier.
    '413':
      $ref: ../components/responses/BotApiUploadTooLarge.yaml
    '429':
      $ref: ../components/responses/BotApiRateLimited.yaml
    '500':
      $ref: ../components/responses/BotApiServerError.yaml
    '503':
      $ref: ../components/responses/BotApiServerError.yaml
