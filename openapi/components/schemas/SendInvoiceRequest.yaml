type: object
additionalProperties: false
required:
  - chat_id
  - title
  - description
  - payload
  - currency
  - prices
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: >-
      The account whose private chat with the bot receives the invoice. The emulator does not send
      invoices to supergroups.
  title:
    type: string
    minLength: 1
    description: The product's name, of 1–32 characters once cleaned as TDLib cleans input strings.
  description:
    type: string
    minLength: 1
    description: >-
      The product's description, of 1–255 characters once cleaned as TDLib cleans input strings.
  payload:
    type: string
    minLength: 1
    description: >-
      The bot's payload, of 1–128 bytes in UTF-8, which the payer never sees and the invoice keeps
      exactly as sent.
  provider_token:
    type: string
    const: ''
    default: ''
    description: Must be empty, as for every payment in Telegram Stars.
  currency:
    type: string
    const: XTR
    description: Telegram Stars, the only currency the emulator supports.
  prices:
    type: array
    minItems: 1
    maxItems: 1
    description: The invoice's one price, as payments in Telegram Stars require.
    items:
      $ref: ./LabeledPrice.yaml
  max_tip_amount:
    type: integer
    const: 0
    default: 0
    description: Tips are not supported for payments in Telegram Stars; only 0 is accepted.
  suggested_tip_amounts:
    type: array
    maxItems: 0
    description: Tips are not supported for payments in Telegram Stars; only an empty list is accepted.
    items:
      type: integer
  start_parameter:
    type: string
    default: ''
    description: >-
      The deep-linking start parameter, which may be empty or omitted. The invoice keeps it cleaned
      as TDLib cleans input strings and always shows it, empty when there is none.
  need_name:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars.
  need_phone_number:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars.
  need_email:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars.
  need_shipping_address:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars; no shipping query follows.
  send_phone_number_to_provider:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars.
  send_email_to_provider:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars.
  is_flexible:
    type: boolean
    description: Ignored, as for every payment in Telegram Stars; no shipping query follows.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
    description: >-
      Only an empty inline keyboard is accepted, which, like an omitted one, lets clients show
      their own Pay button. Invoice keyboards are not supported.
