type: object
additionalProperties: false
required:
  - chat_id
  - from_chat_id
  - message_id
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Identifier of the chat to copy to, as for `forwardMessage`.
  from_chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Identifier of the chat of the copied message, as for `chat_id`.
  message_id:
    type: integer
    description: The copied message's ID in the bot's chat.
  video_start_timestamp:
    type: integer
    description: >-
      The second from which a copied video plays, replacing the video's own; other content
      ignores it. As TDLib reads it, a negative second plays the video from its beginning.
  caption:
    type: string
    maxLength: 1024
    description: >-
      A caption that replaces the caption of a copied photo, document, video, voice note, or audio
      file; an empty
      caption removes it. Omitted, the caption is kept. Text messages ignore it.
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  show_caption_above_media:
    type: boolean
    default: false
    description: With a new caption of a photo or video, shows it above the media.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    description: As for `sendMessage`; the copy never keeps the original's reply markup.
    oneOf:
      - $ref: ./InlineKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardRemove.yaml
      - $ref: ./ForceReply.yaml
