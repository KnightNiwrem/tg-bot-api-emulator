type: object
additionalProperties: false
description: >-
  A phone contact that sending an inline query result writes, read as for `sendContact`: its
  texts are cleaned, a phone number or first name that cleaning empties is refused, and it names
  no Telegram user.
required:
  - phone_number
  - first_name
properties:
  phone_number:
    type: string
    minLength: 1
  first_name:
    type: string
    minLength: 1
    maxLength: 64
  last_name:
    type: string
    maxLength: 64
  vcard:
    type: string
    description: At most 2048 bytes in UTF-8.
