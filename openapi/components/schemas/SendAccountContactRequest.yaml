type: object
additionalProperties: false
description: >-
  A contact the account writes. Its Telegram user stays unknown, as the emulator never looks users
  up by phone number, even when the number is the account's own.
required:
  - to
  - contact
properties:
  to:
    $ref: ./MessageTarget.yaml
  contact:
    type: object
    additionalProperties: false
    required:
      - phone_number
      - first_name
    properties:
      phone_number:
        type: string
        minLength: 1
        description: The contact's phone number, in any form; Telegram never reads it.
      first_name:
        type: string
        minLength: 1
        maxLength: 64
        description: At most 64 characters, counted by code point, as TDLib documents.
      last_name:
        type: string
        maxLength: 64
        default: ''
        description: At most 64 characters; empty for none.
      vcard:
        type: string
        default: ''
        description: A vCard of at most 2048 bytes in UTF-8, which is never parsed; empty for none.
  reply_to_message_id:
    $ref: ./AccountReplyToMessageId.yaml
