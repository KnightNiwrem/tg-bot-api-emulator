type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - input_message_content
properties:
  type:
    type: string
    const: article
  id:
    $ref: ./InlineQueryResultId.yaml
  title:
    type: string
    minLength: 1
  input_message_content:
    oneOf:
      - $ref: ./InputTextMessageContent.yaml
      - $ref: ./InputRichMessageContent.yaml
      - $ref: ./InputContactMessageContent.yaml
      - $ref: ./InputLocationMessageContent.yaml
    description: >-
      The text message, which must have text, the rich message, the contact, or the location that
      sending the article writes.
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  url:
    type: string
  hide_url:
    type: boolean
    description: The older way to omit `url`, which Telegram honors by not sending the URL.
  description:
    type: string
  thumbnail_url:
    type: string
  thumbnail_width:
    type: integer
  thumbnail_height:
    type: integer
