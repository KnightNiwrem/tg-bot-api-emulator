type: object
additionalProperties: false
required:
  - to
  - media
properties:
  to:
    $ref: ./MessageTarget.yaml
  media:
    type: array
    minItems: 1
    maxItems: 10
    description: >-
      The album's photos or documents, in the order the chat shows them, each uploaded as by
      `POST /sessions/{sessionId}/accounts/{accountId}/messages`. Documents form an album only
      with documents. A single item is sent as one message outside any album.
    items:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - photo
          properties:
            photo:
              $ref: ./AccountPhotoUpload.yaml
            caption:
              $ref: ./AccountCaption.yaml
            caption_entities:
              $ref: ./AccountMessageEntities.yaml
        - type: object
          additionalProperties: false
          required:
            - document
          properties:
            document:
              $ref: ./AccountDocumentUpload.yaml
            caption:
              $ref: ./AccountCaption.yaml
            caption_entities:
              $ref: ./AccountMessageEntities.yaml
  reply_to_message_id:
    $ref: ./AccountReplyToMessageId.yaml
    description: >-
      The ID of the chat's message that every message of the album replies to, as message
      history shows it.
