type: object
additionalProperties: false
description: >-
  A static location. Live locations are not supported, so `live_period`, `heading` and
  `proximity_alert_radius` are rejected as unknown parameters, even with values that send a static
  location on Telegram.
required:
  - chat_id
  - latitude
  - longitude
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Identifier of the chat, as for `sendMessage`.
  latitude:
    type: number
    minimum: -90
    maximum: 90
    description: >-
      Latitude in degrees. A form value is a decimal number, possibly with an exponent, which the
      official server trims.
  longitude:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in degrees, read as `latitude` is.
  horizontal_accuracy:
    type: number
    minimum: 0
    maximum: 1500
    default: 0
    description: >-
      The radius of uncertainty in meters, which the location shows rounded up to whole meters;
      0 means unknown. Telegram clamps an accuracy outside the 0–1500 meters the Bot API
      documents, which the emulator rejects.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    description: As for `sendMessage`.
    oneOf:
      - $ref: ./InlineKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardRemove.yaml
      - $ref: ./ForceReply.yaml
