type: object
additionalProperties: false
description: >-
  A request to join a supergroup, in the field order of the official Bot API server. Bios and
  join request queries are not supported.
required:
  - chat
  - from
  - user_chat_id
  - date
  - invite_link
properties:
  chat:
    $ref: ./SupergroupChat.yaml
  from:
    $ref: ./Account.yaml
    description: The account that sent the request.
  user_chat_id:
    $ref: ./TelegramUserId.yaml
    description: >-
      The requester's private chat with the bot, whose ID is the requester's. Until the request
      is processed, the bots that received it may send messages there although the account never
      started them; the first to write claims the contact, which ends the others' permission.
      Other uses of the chat need the account to have started the bot. The emulator does not end
      the permission after five minutes by itself; a test ends it through the requester contact
      expiry route.
  date:
    type: integer
    minimum: 0
    description: Unix timestamp of the request.
  invite_link:
    $ref: ./ChatInviteLink.yaml
    description: >-
      The invite link the request was sent through, as the bot sees it, with the pending
      requests sent through it, this one included.
