type: object
additionalProperties: false
required:
  - type
  - id
properties:
  type:
    type: string
    enum:
      - article
      - photo
      - document
      - video
      - voice
  id:
    type: string
  title:
    type: string
    minLength: 1
    description: Omitted for a photo or voice note without a title.
  description:
    type: string
    minLength: 1
    description: Omitted when the bot gave none.
  url:
    type: string
    minLength: 1
    description: The URL of an article, omitted when the bot gave none or hid it.
