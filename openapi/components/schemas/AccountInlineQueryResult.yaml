type: object
additionalProperties: false
required:
  - type
  - id
properties:
  type:
    type: string
    enum:
      - article
      - contact
      - location
      - photo
      - document
      - video
      - voice
  id:
    type: string
  title:
    type: string
    minLength: 1
    description: Omitted for a location, photo or voice note without a title.
  description:
    type: string
    minLength: 1
    description: >-
      Omitted when the bot gave none. For a contact, its phone number, and for a location, its
      coordinates, as TDLib describes them.
  url:
    type: string
    minLength: 1
    description: The URL of an article, omitted when the bot gave none or hid it.
