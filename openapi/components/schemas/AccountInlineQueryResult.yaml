type: object
additionalProperties: false
required:
  - type
  - id
properties:
  type:
    type: string
    enum:
      - article
      - contact
      - location
      - photo
      - document
      - video
      - voice
      - audio
  id:
    type: string
  title:
    type: string
    minLength: 1
    description: >-
      Cleaned as TDLib's `clean_input_string` cleans it. Omitted for a location, photo, voice
      note or audio file without a title.
  description:
    type: string
    minLength: 1
    description: >-
      Cleaned as TDLib's `clean_input_string` cleans it, and omitted when empty. For a contact,
      its phone number, for a location, its coordinates, and for an audio file, its performer, as
      TDLib describes them.
  url:
    type: string
    minLength: 1
    description: The URL of an article, omitted when the bot gave none or hid it.
