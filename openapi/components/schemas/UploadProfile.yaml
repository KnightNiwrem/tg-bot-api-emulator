type: string
enum:
  - cloud
  - local
description: >-
  The deployment of the official Bot API server whose upload limits the session's bots meet:
  `cloud` for the server Telegram hosts at `api.telegram.org`, `local` for a self-hosted server
  started with `--local`. The profile changes only upload limits; every other behavior, such as
  `getFile`'s download limit and the file sources a bot may name, stays that of the cloud server.
