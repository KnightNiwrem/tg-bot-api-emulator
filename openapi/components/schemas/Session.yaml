type: object
additionalProperties: false
required:
  - id
  - botApiRoot
  - uploadProfile
properties:
  id:
    type: string
    format: uuid
    description: Server-assigned identifier of the test session.
  botApiRoot:
    type: string
    format: uri
    description: Absolute API root for bots operating in this test session.
  uploadProfile:
    $ref: ./UploadProfile.yaml
