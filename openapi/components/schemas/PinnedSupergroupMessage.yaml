description: >-
  A pinned supergroup message as `getChat` and a pin's service message show it: a supergroup
  message that a member wrote, without a `reply_to_message` of its own, since service messages
  are never pinned.
allOf:
  - $ref: ./SupergroupMessage.yaml
  - properties:
      reply_to_message: false
      new_chat_participant: false
      new_chat_member: false
      new_chat_members: false
      left_chat_participant: false
      left_chat_member: false
      new_chat_title: false
      pinned_message: false
