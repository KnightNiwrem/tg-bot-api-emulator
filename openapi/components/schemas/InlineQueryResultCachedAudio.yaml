description: >-
  An audio file the bot knows by `file_id`, which keeps its own metadata. As the official server
  reads them, it also takes a `title` and `performer`, which the Bot API does not document for it;
  the account's client lists the result by them, while the sent audio file keeps its own.
type: object
additionalProperties: false
required:
  - type
  - id
  - audio_file_id
properties:
  type:
    type: string
    const: audio
  id:
    $ref: ./InlineQueryResultId.yaml
  audio_file_id:
    $ref: ./FileId.yaml
  title:
    type: string
  performer:
    type: string
  audio_duration:
    type: integer
    description: Validated and ignored, as the stored audio file keeps its own duration.
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    oneOf:
      - $ref: ./InputTextMessageContent.yaml
      - $ref: ./InputRichMessageContent.yaml
      - $ref: ./InputContactMessageContent.yaml
      - $ref: ./InputLocationMessageContent.yaml
    description: >-
      Text, if it has text, a rich message, a contact, or a location that sending the result writes
      instead of the audio file.
