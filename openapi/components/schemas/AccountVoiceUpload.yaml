description: >-
  A voice note an account sends, which a test defines as a fixture: its duration and MIME type are
  those given here; the emulator neither reads nor transcodes the content.
type: object
additionalProperties: false
required:
  - content_base64
properties:
  content_base64:
    type: string
    contentEncoding: base64
    description: >-
      The recording's content, which must not be empty. An account uploads through its own
      client, so the session's upload profile, which limits bot uploads, does not apply.
  duration:
    type: integer
    minimum: 0
    default: 0
    description: Duration in seconds.
  mime_type:
    type: string
    enum:
      - audio/ogg
      - audio/mpeg
      - audio/mp4
    default: audio/ogg
    description: >-
      The voice note's MIME type: OGG/Opus, MP3 or M4A, the formats Telegram's clients play as
      voice notes. Bots download the file under the extension `oga`, `mp3` or `m4a` of its type.
