type: object
additionalProperties: false
description: >-
  A rich message a bot sends, described as blocks. Telegram also reads a message written in
  HTML or Markdown with `html` or `markdown`, which its servers parse by rules the open-source
  code does not contain; the emulator refuses them (`Bad Request: rich messages written in HTML
  or Markdown are not supported`), along with their `media`. `blocks` may be empty.
required:
  - blocks
properties:
  blocks:
    type: array
    items:
      $ref: ./InputRichBlock.yaml
  is_rtl:
    type: boolean
    default: false
    description: Shows the message right-to-left, which its `is_rtl` shows.
  skip_entity_detection:
    type: boolean
    default: false
    description: >-
      Keeps Telegram from detecting mentions, hashtags, cashtags, bot commands, URLs, email
      addresses, and bank card numbers in the message's plain text, which it otherwise marks as
      rich text of those types. The emulator detects them as in message text, in each plain text
      on its own, outside code, preformatted blocks, links, text mentions, dates, and buttons;
      Telegram's servers detect them by rules the open-source code does not show.
