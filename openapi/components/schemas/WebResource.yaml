type: object
additionalProperties: false
required:
  - url
  - status
  - content_length
properties:
  url:
    type: string
    format: uri
    description: The URL in the canonical form TDLib reads it in.
  status:
    type: integer
    minimum: 200
    maximum: 599
  content_type:
    type: string
  location:
    type: string
  content_length:
    type: integer
    minimum: 0
    description: The size of the response body in bytes.
