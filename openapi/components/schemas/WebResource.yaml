type: object
additionalProperties: false
required:
  - url
  - status
  - content_length
properties:
  url:
    type: string
    format: iri
    description: >-
      The HTTP or HTTPS URL in the canonical form TDLib reads it in, which keeps non-ASCII
      characters as they were given.
  status:
    type: integer
    minimum: 200
    maximum: 599
  content_type:
    type: string
    minLength: 1
  location:
    type: string
    minLength: 1
  content_length:
    type: integer
    minimum: 0
    description: >-
      The size of the registered body in bytes. A 204, 205, or 304 response serves no body, whatever
      was registered.
