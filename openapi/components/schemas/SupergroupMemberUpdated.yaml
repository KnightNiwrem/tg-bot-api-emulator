type: object
additionalProperties: false
description: >-
  A change of another user's standing in a supergroup: an account or bot joins, leaves, or is
  added, removed, promoted, demoted, banned, unbanned, restricted, or freed from its
  restriction. An account may also join by itself or through an invite link.
  A change of the bot's own standing is a my_chat_member update instead.
required:
  - chat
  - from
  - date
  - old_chat_member
  - new_chat_member
properties:
  chat:
    $ref: ./SupergroupChat.yaml
  from:
    $ref: ./MessageUser.yaml
    description: The account or bot that made the change, or the member itself when it left.
  date:
    type: integer
    minimum: 0
    description: Unix timestamp of the change.
  old_chat_member:
    $ref: ./ChatMember.yaml
  new_chat_member:
    $ref: ./ChatMember.yaml
  invite_link:
    $ref: ./ChatInviteLink.yaml
    description: >-
      The invite link the member joined through, as the bot sees it; omitted for every other
      change.
