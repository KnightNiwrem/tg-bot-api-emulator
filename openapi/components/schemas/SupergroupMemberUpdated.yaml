type: object
additionalProperties: false
description: >-
  A change of another user's standing in a supergroup: an account or bot joins, leaves, or
  is removed, promoted, demoted, banned, unbanned, restricted, or freed from its restriction.
  A change of the bot's own standing is a my_chat_member update instead.
required:
  - chat
  - from
  - date
  - old_chat_member
  - new_chat_member
properties:
  chat:
    $ref: ./SupergroupChat.yaml
  from:
    $ref: ./MessageUser.yaml
    description: The account or bot that made the change, or the member itself when it left.
  date:
    type: integer
    minimum: 0
    description: Unix timestamp of the change.
  old_chat_member:
    $ref: ./ChatMember.yaml
  new_chat_member:
    $ref: ./ChatMember.yaml
