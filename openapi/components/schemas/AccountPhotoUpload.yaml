description: >-
  A photo an account sends, which a test defines as a fixture. The emulator reads its dimensions
  from the image header and keeps the bytes unchanged.
type: object
additionalProperties: false
required:
  - content_base64
properties:
  content_base64:
    type: string
    contentEncoding: base64
    description: >-
      A JPEG, PNG, GIF, WebP, or BMP image whose header gives positive dimensions. No size,
      dimension or aspect-ratio limit applies: Telegram's photo upload limits bind the uploader,
      and the Bot API states no bounds on the photos bots receive. Telegram also accepts other
      image formats, such as TIFF, which the emulator rejects.
