type: object
additionalProperties: false
required:
  - url
properties:
  url:
    type: string
    minLength: 1
    description: >-
      An HTTP or HTTPS URL, read as TDLib reads the URL a bot sends a file by, so that every
      spelling TDLib reads alike finds the resource. A URL without a protocol is an HTTP one.
  status:
    type: integer
    minimum: 200
    maximum: 599
    default: 200
    description: >-
      The HTTP status. Telegram sends a file only from a 2xx response; a 301, 302, 303, 307, or
      308 response with a `location` redirects the download.
  content_type:
    type: string
    minLength: 1
    description: >-
      The `Content-Type` header. A photo must be served as an image, and a document as
      `application/pdf` or `application/zip`.
  location:
    type: string
    minLength: 1
    description: The `Location` header of a redirect, relative to `url` or absolute.
  content_base64:
    type: string
    contentEncoding: base64
    default: ''
    description: The response body.
