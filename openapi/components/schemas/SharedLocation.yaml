type: object
additionalProperties: false
description: >-
  A point on Earth an account shared, as the Bot API shows it, in the field order Telegram uses.
required:
  - latitude
  - longitude
properties:
  latitude:
    type: number
    minimum: -90
    maximum: 90
  longitude:
    type: number
    minimum: -180
    maximum: 180
  horizontal_accuracy:
    type: integer
    minimum: 1
    maximum: 1500
    description: >-
      The radius of uncertainty in whole meters, the shared accuracy rounded up as TDLib sends it
      to Telegram; omitted when unknown, which an accuracy of 0 means.
