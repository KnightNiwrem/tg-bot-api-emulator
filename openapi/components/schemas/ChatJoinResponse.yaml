type: object
additionalProperties: false
required:
  - chat_id
  - outcome
properties:
  chat_id:
    $ref: ./SupergroupChatId.yaml
    description: The supergroup the link leads to.
  outcome:
    type: string
    enum:
      - joined
      - join_request_sent
    description: >-
      `joined` when the account joined the supergroup; `join_request_sent` when the link creates
      join requests, which leaves the account outside with a pending request.
