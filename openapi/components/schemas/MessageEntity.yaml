description: >-
  A marked span of message text, of each kind with exactly the fields it has. Formatting that
  overlaps other entities is split so that entities nest properly, as on Telegram. Mentions,
  hashtags, cashtags, bot commands, URLs, email addresses and bank card numbers are detected in
  the text as Telegram detects them, outside other entities; phone numbers are not detected.
  `offset` and `length` count UTF-16 code units, from the start of the text to the start of the
  entity and over the entity.
oneOf:
  - type: object
    additionalProperties: false
    description: An entity that carries nothing beyond its span.
    required:
      - type
      - offset
      - length
    properties:
      type:
        type: string
        enum:
          - mention
          - hashtag
          - cashtag
          - bot_command
          - url
          - email
          - bank_card_number
          - bold
          - italic
          - underline
          - strikethrough
          - spoiler
          - code
          - blockquote
          - expandable_blockquote
      offset:
        type: integer
        minimum: 0
      length:
        type: integer
        minimum: 1
  - type: object
    additionalProperties: false
    description: A block of preformatted code.
    required:
      - type
      - offset
      - length
    properties:
      type:
        type: string
        const: pre
      offset:
        type: integer
        minimum: 0
      length:
        type: integer
        minimum: 1
      language:
        type: string
        minLength: 1
        description: The programming language of the code, when one is given.
  - type: object
    additionalProperties: false
    description: A link under text.
    required:
      - type
      - offset
      - length
      - url
    properties:
      type:
        type: string
        const: text_link
      offset:
        type: integer
        minimum: 0
      length:
        type: integer
        minimum: 1
      url:
        type: string
        description: The link as Telegram normalized it.
  - type: object
    additionalProperties: false
    description: A mention of a user by text rather than by username.
    required:
      - type
      - offset
      - length
      - user
    properties:
      type:
        type: string
        const: text_mention
      offset:
        type: integer
        minimum: 0
      length:
        type: integer
        minimum: 1
      user:
        description: The mentioned user.
        oneOf:
          - $ref: ./Account.yaml
          - $ref: ./MessageSenderBot.yaml
  - $ref: ./CustomEmojiMessageEntity.yaml
  - type: object
    additionalProperties: false
    description: A moment that clients show in the reader's time zone.
    required:
      - type
      - offset
      - length
      - unix_time
      - date_time_format
    properties:
      type:
        type: string
        const: date_time
      offset:
        type: integer
        minimum: 0
      length:
        type: integer
        minimum: 1
      unix_time:
        type: integer
        minimum: 1
        description: The shown moment as a Unix time.
      date_time_format:
        type: string
        pattern: '^(r|w?[dD]?[tT]?)$'
        description: >-
          How clients show it, as the official Bot API server reports it: `r` for relative time,
          otherwise `w` for the day of the week, `d` or `D` for a short or long date, then `t` or
          `T` for a short or long time; empty when the bot chose no format.
