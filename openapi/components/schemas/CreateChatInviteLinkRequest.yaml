type: object
additionalProperties: false
required:
  - chat_id
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: >-
      Identifier of the supergroup: its negative chat ID, or `@username` for a public one.
  name:
    type: string
    default: ''
    description: >-
      The link's name, which Telegram cleans as a chat title: unusual spaces become spaces,
      each run of spaces and line breaks one space, and at most 32 characters are kept. Empty
      for none.
  expire_date:
    type: integer
    minimum: 0
    description: >-
      Unix time when the link stops working, which must lie in the future; 0 or omitted for no
      expiry date. The emulator never lets the date arrive by itself: a test makes it arrive.
  member_limit:
    type: integer
    minimum: 0
    maximum: 99999
    description: >-
      How many users that joined through the link may be members at once, 1-99999; 0 or
      omitted for no limit. A member that leaves, or is removed, frees its place. A greater
      limit is refused with `Bad Request: USAGE_LIMIT_INVALID`.
  creates_join_request:
    type: boolean
    default: false
    description: >-
      Whether users who use the link send a join request instead of joining. Such a link takes
      no member limit.
