type: object
additionalProperties: false
required:
  - chat_id
  - message_id
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: >-
      Identifier of the chat: for a private chat, the account's user ID; for a supergroup, its
      negative chat ID, or `@username` for a public one.
  message_id:
    type: integer
    description: Identifier of the message to pin in the bot's chat.
  disable_notification:
    type: boolean
    default: false
    description: >-
      Makes the pin's service message notify a supergroup's members without sound. Pins in
      private chats always notify without sound.
