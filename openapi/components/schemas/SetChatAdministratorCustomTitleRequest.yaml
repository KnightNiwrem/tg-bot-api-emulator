type: object
additionalProperties: false
required:
  - chat_id
  - user_id
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: >-
      Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
      where the method is unavailable, the account's user ID.
  user_id:
    $ref: ./TelegramUserId.yaml
  custom_title:
    type: string
    default: ''
    description: >-
      The new title, of at most 16 characters counted by code point and without emoji, as the
      Bot API documents it; empty removes the title.
