type: object
additionalProperties: false
description: >-
  A supergroup administrator with every right Telegram shows, held or not.
required:
  - user
  - status
  - can_be_edited
  - can_manage_chat
  - can_change_info
  - can_delete_messages
  - can_invite_users
  - can_restrict_members
  - can_pin_messages
  - can_manage_topics
  - can_promote_members
  - can_manage_video_chats
  - can_post_stories
  - can_edit_stories
  - can_delete_stories
  - can_manage_tags
  - can_send_welcome_messages
  - is_anonymous
  - can_manage_voice_chats
properties:
  user:
    $ref: ./MessageUser.yaml
  status:
    type: string
    const: administrator
  can_be_edited:
    type: boolean
    description: >-
      Whether the observing bot may change the administrator's rights or demote it: it holds
      `can_promote_members` and promoted the administrator, directly or through administrators
      it promoted.
  can_manage_chat:
    type: boolean
  can_change_info:
    type: boolean
  can_delete_messages:
    type: boolean
  can_invite_users:
    type: boolean
  can_restrict_members:
    type: boolean
  can_pin_messages:
    type: boolean
  can_manage_topics:
    type: boolean
  can_promote_members:
    type: boolean
  can_manage_video_chats:
    type: boolean
  can_post_stories:
    type: boolean
  can_edit_stories:
    type: boolean
  can_delete_stories:
    type: boolean
  can_manage_tags:
    type: boolean
  can_send_welcome_messages:
    type: boolean
  is_anonymous:
    type: boolean
    const: false
  can_manage_voice_chats:
    type: boolean
    description: Legacy alias of `can_manage_video_chats`.
  custom_title:
    $ref: ./CustomTitle.yaml
