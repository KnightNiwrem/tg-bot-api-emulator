type: object
additionalProperties: false
description: >-
  The users and chats a command list applies to; a missing scope is the default scope. A
  `chat` scope names a private chat already started with the bot or a supergroup the bot is a
  member of, and `chat_administrators` and `chat_member` scopes name only such a supergroup.
required:
  - type
properties:
  type:
    type: string
    enum:
      - default
      - all_private_chats
      - all_group_chats
      - all_chat_administrators
      - chat
      - chat_administrators
      - chat_member
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Required for `chat`, `chat_administrators`, and `chat_member`.
  user_id:
    type: integer
    minimum: 1
    description: Required for `chat_member`.
