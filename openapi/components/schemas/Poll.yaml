type: object
additionalProperties: false
description: >-
  A regular poll or a quiz as the official Bot API server's `JsonPoll` shows it to bots, with its
  votes as they are now. Every forward of a poll's message shows the same poll; a copy shows a new
  one. The emulator's polls never restrict who may vote, so `members_only` is false and
  `country_codes` is omitted; descriptions and media are not supported.
required:
  - id
  - question
  - options
  - total_voter_count
  - is_closed
  - is_anonymous
  - allows_multiple_answers
  - allows_revoting
  - members_only
  - type
properties:
  id:
    type: string
    pattern: '^[1-9]\d*$'
    maxLength: 19
    description: The poll's identifier, the decimal text of a positive 64-bit integer.
  question:
    type: string
    minLength: 1
    description: The question, at most 300 characters as Telegram counts them.
  question_entities:
    type: array
    minItems: 1
    description: >-
      The custom emoji of the question, the only entities Telegram keeps in questions; omitted
      when there are none.
    items:
      allOf:
        - $ref: ./MessageEntity.yaml
        - properties:
            type:
              const: custom_emoji
          required:
            - custom_emoji_id
  options:
    type: array
    minItems: 1
    maxItems: 12
    items:
      $ref: ./PollOption.yaml
  total_voter_count:
    type: integer
    minimum: 0
    description: How many accounts chose any option, each counted once.
  open_period:
    type: integer
    minimum: 5
    maximum: 2628000
    description: >-
      How long the poll stays open after it was sent; present, with `close_date`, only while a
      poll sent with `open_period` or `close_date` is open.
  close_date:
    type: integer
    description: >-
      When the poll closes by itself, as a Unix time; present only with `open_period`. The
      emulator does not close polls as time passes; the poll expiry route closes it.
  is_closed:
    type: boolean
    description: Whether the poll no longer accepts answers.
  is_anonymous:
    type: boolean
    description: Whether the poll hides who voted for what.
  allows_multiple_answers:
    type: boolean
  allows_revoting:
    type: boolean
    description: Whether a voter may change or retract its answer.
  members_only:
    type: boolean
    const: false
  type:
    type: string
    enum:
      - regular
      - quiz
  correct_option_id:
    type: integer
    minimum: 0
    description: >-
      The correct option of a quiz with exactly one, shown to the bot that sent the quiz, to an
      account that answered it, and to everyone once it is closed.
  correct_option_ids:
    type: array
    minItems: 1
    description: The correct options of a quiz, in increasing order, shown as `correct_option_id` is.
    items:
      type: integer
      minimum: 0
  explanation:
    type: string
    minLength: 1
    maxLength: 200
    description: A quiz's explanation, shown as `correct_option_id` is; omitted without one.
  explanation_entities:
    type: array
    description: >-
      Entities marked in the explanation, present with it even when empty, as the official server
      writes them.
    items:
      $ref: ./MessageEntity.yaml
