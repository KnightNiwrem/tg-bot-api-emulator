description: >-
  New text for a text message, or a new caption for a photo, document, video, voice note, or audio
  file.
oneOf:
  - type: object
    additionalProperties: false
    required:
      - text
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 4096
        description: >-
          The new text, normalized as when sending a message. It must differ from the
          message's current text and entities after normalization.
      entities:
        $ref: ./AccountMessageEntities.yaml
  - type: object
    additionalProperties: false
    required:
      - caption
    properties:
      caption:
        type: string
        description: >-
          The new caption, normalized as when sending media; empty removes the
          caption. It must differ from the message's current caption and entities after
          normalization.
      caption_entities:
        $ref: ./AccountMessageEntities.yaml
