type: object
additionalProperties: false
description: >-
  A regular poll or a quiz to send. Options added after creation, restrictions on who may vote,
  shuffled options, results hidden until the poll closes, descriptions, and media are not
  supported, nor are topics, business connections, paid broadcasts, and suggested posts. The quiz
  parameters are rejected for a regular poll, and `open_period` with `close_date`.
required:
  - chat_id
  - question
  - options
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: >-
      Identifier of the chat, as for `sendMessage`: for a private chat, the account's user
      ID; for a supergroup, its negative chat ID, or `@` followed by the username of a public
      supergroup.
  question:
    type: string
    minLength: 1
    description: >-
      The question, normalized as message text is, which must keep 1–300 characters. As
      Telegram keeps them, only custom emoji remain of its formatting.
  question_parse_mode:
    $ref: ./ParseMode.yaml
  question_entities:
    type: array
    description: Entities marking the question; ignored when `question_parse_mode` formats it.
    items:
      $ref: ./MessageEntityParameter.yaml
  options:
    type: array
    minItems: 1
    maxItems: 12
    description: >-
      The answer options, 1–12, in the order clients show them. `null` holds none, which
      Telegram refuses.
    items:
      $ref: ./InputPollOption.yaml
  is_anonymous:
    type: boolean
    default: true
    description: >-
      Whether the poll hides who voted for what. Bots never learn the voters of an anonymous
      poll.
  type:
    type: string
    default: regular
    enum:
      - ''
      - regular
      - quiz
    description: The poll's type; empty means `regular`.
  allows_multiple_answers:
    type: boolean
    default: false
  allows_revoting:
    type: boolean
    description: >-
      Whether voters may change or retract their answers; defaults to true for a regular poll and
      to false for a quiz.
  correct_option_ids:
    type: array
    description: >-
      The correct options of a quiz, counted from 0, in increasing order; at least one is
      required.
    items:
      type: integer
  correct_option_id:
    type: integer
    description: The older form of a single correct option, ignored with `correct_option_ids`.
  explanation:
    type: string
    description: >-
      What clients show a voter who chose a wrong option of a quiz, 0–200 characters with at most 2
      line feeds after normalization, which keeps all its entities.
  explanation_parse_mode:
    $ref: ./ParseMode.yaml
  explanation_entities:
    type: array
    description: Entities marking the explanation; ignored when `explanation_parse_mode` formats it.
    items:
      $ref: ./MessageEntityParameter.yaml
  open_period:
    type: integer
    minimum: 5
    maximum: 2628000
    description: >-
      How long the poll stays open, in seconds. The emulator does not close polls as time passes;
      the poll expiry route closes it.
  close_date:
    type: integer
    description: >-
      When the poll closes, as a Unix time 5 to 2628000 seconds from now, which the poll shows
      with the matching `open_period`.
  is_closed:
    type: boolean
    default: false
    description: Sends the poll already closed, as a preview.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    description: As for `sendMessage`.
    oneOf:
      - $ref: ./InlineKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardRemove.yaml
      - $ref: ./ForceReply.yaml
