description: >-
  A photo, document, or video that `editMessageMedia` puts in a message or that `sendMediaGroup`
  sends, as the Bot API's `InputMediaPhoto`, `InputMediaDocument` and `InputMediaVideo` describe
  it. `media` is the `file_id` of a file of that type the bot knows, or `attach://<part name>` for
  a file uploaded in that part (`Bad Request: can't parse InputMedia: media not found` when no part
  has that name), or an HTTP or HTTPS URL, which is downloaded the same way as for `sendPhoto`,
  `sendDocument` and `sendVideo`. Telegram's `audio` and `live_photo` media are not supported
  (`Bad Request: InputMedia of type "…" is not supported`), nor is its `animation` outside an
  album, and other types are refused as
  Telegram refuses them (`Bad Request: can't parse InputMedia: type "…" is unsupported`, `type
  "voice_note" is not allowed`, or, in an album, `type "animation" can't be used in
  sendMediaGroup`). The caption is formatted and normalized as by `sendPhoto`; a caption Telegram
  cannot read fails with its description prefixed by `Bad Request: can't parse InputMedia: `.
oneOf:
  - type: object
    additionalProperties: false
    required:
      - type
      - media
    properties:
      type:
        type: string
        const: photo
      media:
        type: string
      caption:
        $ref: ./Caption.yaml
      parse_mode:
        $ref: ./ParseMode.yaml
      caption_entities:
        $ref: ./CaptionEntitiesParameter.yaml
      show_caption_above_media:
        type: boolean
        default: false
      has_spoiler:
        type: boolean
        default: false
  - type: object
    additionalProperties: false
    required:
      - type
      - media
    properties:
      type:
        type: string
        const: document
      media:
        type: string
      thumbnail:
        type: string
        description: >-
          `attach://<part name>` for a thumbnail uploaded in that part, which works as the
          thumbnail of `sendDocument` does.
      caption:
        $ref: ./Caption.yaml
      parse_mode:
        $ref: ./ParseMode.yaml
      caption_entities:
        $ref: ./CaptionEntitiesParameter.yaml
      disable_content_type_detection:
        type: boolean
        description: >-
          Accepted and ignored: the emulator never detects other media types in documents.
  - type: object
    additionalProperties: false
    description: >-
      A video, read as `sendVideo` reads its parameters: its attributes are clamped as the
      official server's `get_input_video` clamps them, a video sent by `file_id` keeps its own,
      and a `cover` is not supported.
    required:
      - type
      - media
    properties:
      type:
        type: string
        const: video
      media:
        type: string
      thumbnail:
        type: string
        description: >-
          `attach://<part name>` for a thumbnail uploaded in that part, which works as the
          thumbnail of `sendVideo` does.
      start_timestamp:
        type: integer
        default: 0
        description: As for `sendVideo`.
      caption:
        $ref: ./Caption.yaml
      parse_mode:
        $ref: ./ParseMode.yaml
      caption_entities:
        $ref: ./CaptionEntitiesParameter.yaml
      show_caption_above_media:
        type: boolean
        default: false
      width:
        type: integer
        default: 0
        description: As for `sendVideo`.
      height:
        type: integer
        default: 0
        description: As for `sendVideo`.
      duration:
        type: integer
        default: 0
        description: As for `sendVideo`.
      supports_streaming:
        type: boolean
        description: Accepted and ignored, as for `sendVideo`.
      has_spoiler:
        type: boolean
        default: false
