description: A voice note the bot knows by `file_id`, which keeps its own duration.
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - voice_file_id
properties:
  type:
    type: string
    const: voice
  id:
    $ref: ./InlineQueryResultId.yaml
  voice_file_id:
    $ref: ./FileId.yaml
  title:
    type: string
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    oneOf:
      - $ref: ./InputTextMessageContent.yaml
      - $ref: ./InputRichMessageContent.yaml
      - $ref: ./InputContactMessageContent.yaml
      - $ref: ./InputLocationMessageContent.yaml
    description: >-
      Text, if it has text, a rich message, a contact, or a location that sending the result writes
      instead of the voice note.
