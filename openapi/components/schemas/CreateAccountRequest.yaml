type: object
additionalProperties: false
required:
  - first_name
properties:
  first_name:
    type: string
    minLength: 1
    maxLength: 64
    description: >-
      At most 64 characters, counted by code point, the server-side limit TDLib's
      `UserManager::MAX_NAME_LENGTH` gives a user's names. It must be well-formed Unicode that
      Telegram's cleanup of the account's own contact leaves unchanged. Names with carriage
      returns, directional overrides, or control characters other than line feeds are among those
      refused.
  last_name:
    type: string
    minLength: 1
    maxLength: 64
    description: At most 64 characters, as clean as `first_name` must be.
  username:
    type: string
    minLength: 1
  language_code:
    type: string
    minLength: 1
  has_private_forwards:
    type: boolean
    default: false
    description: >-
      Sets the account's "Forwarded messages" privacy setting so that forwards of its
      messages, and replies to them from other chats, do not link to it. Their origin is a
      hidden user that shows only the account's first and last name.
  phone_number:
    type: string
    pattern: '^[1-9][0-9]{0,14}$'
    description: >-
      The number the account signed up with, as the digits of an E.164 number without its `+`,
      as Telegram's `user.phone` holds them. The account shares it as its own contact, directly or
      by pressing a `request_contact` button; an account without one has no contact of its own.
      The emulator shows it nowhere else and never looks accounts up by it.
