type: object
additionalProperties: false
required:
  - chat_id
  - phone_number
  - first_name
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Identifier of the chat, as for `sendMessage`.
  phone_number:
    type: string
    minLength: 1
    description: The contact's phone number, in any form; Telegram never reads it.
  first_name:
    type: string
    minLength: 1
    maxLength: 64
    description: >-
      The contact's first name. TDLib documents at most 64 characters, counted by code point; the
      emulator rejects a longer name.
  last_name:
    type: string
    maxLength: 64
    default: ''
    description: The contact's last name, of at most 64 characters as for `first_name`; empty for none.
  vcard:
    type: string
    default: ''
    description: >-
      Additional data about the contact as a vCard of at most 2048 bytes in UTF-8, as the Bot API
      documents it; empty for none. The emulator, like Telegram, never parses it.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    description: As for `sendMessage`.
    oneOf:
      - $ref: ./InlineKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardRemove.yaml
      - $ref: ./ForceReply.yaml
