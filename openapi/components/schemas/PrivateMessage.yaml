type: object
additionalProperties: false
description: >-
  A private-chat message as the conversation's bot sees it: text, a photo, a document, a video, a
  voice note, a rich message, a poll, a contact, or a location, each with the fields Telegram shows
  for it.
required:
  - message_id
  - from
  - chat
  - date
oneOf:
  - required:
      - text
  - required:
      - photo
  - required:
      - document
  - required:
      - video
  - required:
      - voice
  - required:
      - rich_message
  - required:
      - poll
  - required:
      - contact
    properties:
      contact:
        $ref: ./Contact.yaml
  - required:
      - location
    properties:
      location:
        $ref: ./Location.yaml
properties:
  message_id:
    type: integer
    minimum: 1
    description: >-
      Message ID in the conversation bot's message sequence, which spans all of that bot's
      private chats. Other observers can number the same message differently.
  from:
    description: The account or bot that wrote the message.
    oneOf:
      - $ref: ./Account.yaml
      - $ref: ./MessageSenderBot.yaml
  chat:
    $ref: ./PrivateChat.yaml
    description: The account's private chat, whichever participant wrote the message.
  date:
    type: integer
    minimum: 0
    description: Unix timestamp when the emulator accepted the message.
  edit_date:
    type: integer
    minimum: 0
    description: >-
      Unix timestamp of the last edit of the text or caption by its author, omitted if the
      message's content was never edited. Replacing only the inline keyboard does not change
      it.
  forward_origin:
    $ref: ./MessageOrigin.yaml
  forward_from:
    $ref: ./MessageUser.yaml
    description: >-
      Legacy form of `forward_origin.sender_user`, present only for a forward whose origin is
      a user.
  forward_sender_name:
    type: string
    minLength: 1
    description: >-
      Legacy form of `forward_origin.sender_user_name`, present only for a forward whose
      origin is a hidden user.
  forward_date:
    type: integer
    minimum: 0
    description: Legacy form of `forward_origin.date`, present only for a forward.
  reply_to_message:
    $ref: ./PrivateMessage.yaml
    description: >-
      The current state of the message this one replies to, which never has a
      `reply_to_message` of its own. Omitted when the message is no reply or the replied
      message was deleted.
  external_reply:
    $ref: ./ExternalReplyInfo.yaml
  quote:
    $ref: ./TextQuote.yaml
  media_group_id:
    type: string
    pattern: '^[1-9]\d*$'
    maxLength: 19
    description: >-
      The identifier the messages of an album share, as the decimal text of a positive 64-bit
      integer; omitted for a message outside albums. Each album sent gets a new one.
  text:
    type: string
    description: The text of a text message.
  entities:
    type: array
    minItems: 1
    description: >-
      Entities marked in the text, omitted when there are none: formatting the bot applied,
      and bot commands, which, as Telegram does in chats with bots, the emulator marks in text
      written by either participant. Other entity types Telegram detects, such
      as URLs and mentions, are not detected.
    items:
      $ref: ./MessageEntity.yaml
  photo:
    type: array
    minItems: 1
    description: >-
      The sizes of a photo message's photo, smallest first. Telegram converts a photo to
      JPEG and keeps it in several sizes; the emulator keeps the one size and the format it
      was sent in.
    items:
      $ref: ./PhotoSize.yaml
  document:
    $ref: ./Document.yaml
  video:
    $ref: ./Video.yaml
  voice:
    $ref: ./Voice.yaml
  caption:
    type: string
    minLength: 1
    description: The caption of a photo, document, video, or voice note, omitted when it has none.
  caption_entities:
    type: array
    minItems: 1
    description: Entities marked in the caption, as in text; omitted when there are none.
    items:
      $ref: ./MessageEntity.yaml
  show_caption_above_media:
    type: boolean
    const: true
    description: Present when clients show the caption of a photo or video above it.
  has_media_spoiler:
    type: boolean
    const: true
    description: Present when clients cover the photo or video until the user reveals it.
  rich_message:
    $ref: ./RichMessage.yaml
    description: >-
      The blocks of a rich message, which only bots send, as `sendRichMessage` describes them.
  poll:
    $ref: ./Poll.yaml
    description: >-
      The poll of a poll message, which only bots send, with its votes as they are now.
  contact:
    $ref: ./Contact.yaml
    description: The phone contact of a contact message.
  location:
    $ref: ./Location.yaml
    description: The static location of a location message.
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
    description: >-
      The inline keyboard the bot attached, or the inline bot of a message sent through it;
      omitted when there is none.
  via_bot:
    $ref: ./MessageSenderBot.yaml
    description: >-
      The bot through whose inline mode the account sent the message, or the original of a
      forward; omitted for other messages.
  has_protected_content:
    type: boolean
    const: true
    description: >-
      Present when the bot protected the message from forwarding and saving with
      `protect_content`, or when the message belongs to a supergroup whose owner protects all
      its content.
  effect_id:
    type: string
    pattern: '^-?\d+$'
    description: >-
      The message effect the bot chose with `message_effect_id`, as the decimal text of its
      64-bit identifier; omitted for none.
