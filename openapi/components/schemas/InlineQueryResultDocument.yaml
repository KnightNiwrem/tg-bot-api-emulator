description: >-
  A document the bot names by URL, which Telegram downloads from the session's emulated web each
  time an account sends it without `input_message_content`; it must be served as
  `application/pdf` or `application/zip` and be at most 20 MB, and is named after the URL's last
  path segment.
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - document_url
  - mime_type
properties:
  type:
    type: string
    const: document
  id:
    $ref: ./InlineQueryResultId.yaml
  title:
    type: string
    minLength: 1
  document_url:
    type: string
    minLength: 1
    description: >-
      An HTTP or HTTPS URL, read as TDLib reads the URL of a file sent by URL, so a URL without a
      protocol is an HTTP one.
  mime_type:
    type: string
    pattern: ^application/(pdf|zip)
    description: >-
      The declared type, which TDLib requires to begin with `application/pdf` or
      `application/zip`. The sent document has the type the URL serves it as.
  description:
    type: string
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    oneOf:
      - $ref: ./InputTextMessageContent.yaml
      - $ref: ./InputRichMessageContent.yaml
    description: >-
      Text, if it has text, or a rich message that sending the result writes instead of the
      document, which is then not downloaded.
  thumbnail_url:
    type: string
    description: >-
      The URL of the thumbnail the client lists, an HTTP or HTTPS URL that is not downloaded.
  thumbnail_width:
    type: integer
    description: Validated and ignored.
  thumbnail_height:
    type: integer
    description: Validated and ignored.
