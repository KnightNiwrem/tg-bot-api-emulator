type: object
additionalProperties: false
description: >-
  A failed attempt to deliver an update to a webhook, which leaves the update pending until the
  attempt's retry is released. It follows the attempt's `update_delivered` entry.
required:
  - position
  - kind
  - bot_id
  - update_id
  - webhook_attempt_id
  - failure
  - retry_delay_seconds
properties:
  position:
    $ref: ./BotActivityPosition.yaml
  kind:
    type: string
    const: webhook_attempt_failed
  bot_id:
    $ref: ./TelegramUserId.yaml
  update_id:
    type: integer
  chat_id:
    type: integer
    description: The chat the update happened in; omitted for updates without one.
  user_id:
    type: integer
    description: >-
      The user whose action caused the update; omitted for a poll's new state and a stopped
      message generation, which name no user.
  webhook_attempt_id:
    type: integer
    minimum: 1
  failure:
    $ref: ./WebhookAttemptFailure.yaml
  retry_delay_seconds:
    type: integer
    minimum: 0
    description: The wait before the update is sent again that `automatic` scheduling observes.
