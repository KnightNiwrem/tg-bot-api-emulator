type: object
additionalProperties: false
description: >-
  A regular static sticker a test defines as a fixture: a WebP image and the emoji it is
  associated with. The emulator reads only the header that gives the image's dimensions, as it
  reads an account's photo. Any dimensions and size are accepted: Telegram's sticker-set
  preparation rules, such as a 512-pixel side or a 512 KB limit, are not applied, since Telegram
  documents none for sending a sticker.
required:
  - content_base64
properties:
  content_base64:
    type: string
    contentEncoding: base64
    description: >-
      The WebP image, which must not be empty. Its first chunk gives its dimensions: the
      bitstream header of a simple lossy (`VP8 `) or lossless (`VP8L`) image, or the canvas of
      an extended (`VP8X`) image. An animated WebP image is sent as a regular static sticker of
      its canvas. TGS and WebM content, which would be animated and video stickers, is not a
      WebP image. An account uploads through its own client, so the session's upload profile,
      which limits bot uploads, does not apply.
  emoji:
    type: string
    minLength: 1
    description: The emoji the sticker is associated with; omitted for none.
