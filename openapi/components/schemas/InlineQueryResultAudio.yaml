description: >-
  An audio file the bot names by URL, which Telegram downloads from the session's emulated web
  each time an account sends it without `input_message_content`; it must be served as
  `audio/mpeg`, the type TDLib gives its web document, and be at most 20 MB. The sent audio file
  is named after the URL's last path segment and takes the result's title, performer and
  duration, as TDLib gives the web document their attributes. The account's client lists the
  result by its title and performer.
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - audio_url
properties:
  type:
    type: string
    const: audio
  id:
    $ref: ./InlineQueryResultId.yaml
  audio_url:
    type: string
    minLength: 1
    description: >-
      An HTTP or HTTPS URL, read as TDLib reads the URL of a file sent by URL, so a URL without a
      protocol is an HTTP one.
  title:
    type: string
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  performer:
    type: string
  audio_duration:
    type: integer
    description: Seconds, clamped to 0 through 86400, as for `sendAudio`.
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    oneOf:
      - $ref: ./InputTextMessageContent.yaml
      - $ref: ./InputRichMessageContent.yaml
      - $ref: ./InputContactMessageContent.yaml
      - $ref: ./InputLocationMessageContent.yaml
    description: >-
      Text, if it has text, a rich message, a contact, or a location that sending the result writes
      instead of the audio file, which is then not downloaded.
