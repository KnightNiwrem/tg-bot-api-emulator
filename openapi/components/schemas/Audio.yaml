type: object
additionalProperties: false
description: >-
  An audio file, such as a music track, in the field order of the official Bot API server's
  `JsonAudio`. Its duration, title and performer are those its sender defined; the emulator
  neither reads nor transcodes its content, and reads no tags from it.
required:
  - duration
  - mime_type
  - file_id
  - file_unique_id
  - file_size
properties:
  duration:
    type: integer
    minimum: 0
    maximum: 86400
    description: Duration in seconds as the sender defined it; 0 when it specified none.
  file_name:
    type: string
    minLength: 1
    description: >-
      The file's name, cleaned as a document's for a bot's upload; omitted for an audio file an
      account sent without one, or one sent by a URL whose path ends without a name.
  mime_type:
    type: string
    pattern: '^audio/'
    description: >-
      The `audio/` MIME type the file name's extension decides, as for a document, or
      `audio/mpeg` when the name decides another type or there is none, as TDLib's
      `AudiosManager` uploads an audio file; for an audio file sent by URL, `audio/mpeg`, the type
      it must be served as.
  title:
    type: string
    minLength: 1
    description: >-
      The title as the sender defined it, cleaned as TDLib's `clean_input_string` cleans it;
      omitted for none.
  performer:
    type: string
    minLength: 1
    description: >-
      The performer as the sender defined it, cleaned as the title is; omitted for none.
  thumbnail:
    $ref: ./PhotoSize.yaml
    description: >-
      The preview image a bot uploaded with the audio file, such as its album's cover, kept as it
      was sent; omitted for none. It has a `file_id` and `file_unique_id` of its own.
  thumb:
    $ref: ./PhotoSize.yaml
    description: Legacy copy of `thumbnail`, which the Bot API still shows.
  file_id:
    $ref: ./FileId.yaml
  file_unique_id:
    $ref: ./FileUniqueId.yaml
  file_size:
    type: integer
    minimum: 1
    description: Size of the file in bytes.
