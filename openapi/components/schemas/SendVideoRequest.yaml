type: object
additionalProperties: false
required:
  - chat_id
properties:
  chat_id:
    $ref: ./ChatIdentifier.yaml
    description: Identifier of the chat, as for `sendMessage`.
  video:
    type: string
    description: >-
      The `file_id` of a video the bot knows, `attach://<part name>` for a file uploaded in that
      part, or an HTTP or HTTPS URL to download it from. Without it, the video is the part named
      `video`.
  duration:
    type: integer
    default: 0
    description: >-
      Duration in seconds, which the official server clamps to 0–86400. A video sent by
      `file_id` keeps its own.
  width:
    type: integer
    default: 0
    description: >-
      Width, which the official server clamps to 0–10000. A video sent by `file_id` keeps its
      own.
  height:
    type: integer
    default: 0
    description: >-
      Height, which the official server clamps to 0–10000. A video sent by `file_id` keeps its
      own.
  thumbnail:
    type: string
    description: >-
      A preview image uploaded with the video, read as for `sendDocument`. A video sent by
      `file_id` keeps its own thumbnail, and one sent by URL takes none.
  thumb:
    type: string
    description: >-
      Legacy name of `thumbnail`, read as it is when `thumbnail` names no uploaded part.
  start_timestamp:
    type: integer
    default: 0
    description: >-
      The second from which clients play the video in the message, which the official server
      clamps to 0–86400.
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  show_caption_above_media:
    type: boolean
    default: false
    description: Shows the caption above the video.
  has_spoiler:
    type: boolean
    default: false
    description: Covers the video until the user reveals it.
  supports_streaming:
    type: boolean
    description: >-
      Validated and without effect: TDLib passes it to Telegram's servers, the Bot API never
      shows it, and the emulator does not stream or transcode video.
  disable_notification:
    type: boolean
    default: false
    description: As for `sendMessage`.
  protect_content:
    type: boolean
    default: false
    description: As for `sendMessage`.
  message_effect_id:
    type: string
    pattern: '^-?\d+$'
    description: As for `sendMessage`.
  reply_parameters:
    $ref: ./ReplyParameters.yaml
  reply_to_message_id:
    type: integer
    description: As for `sendMessage`.
  allow_sending_without_reply:
    type: boolean
    default: false
    description: As for `sendMessage`.
  reply_markup:
    description: As for `sendMessage`.
    oneOf:
      - $ref: ./InlineKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardMarkup.yaml
      - $ref: ./ReplyKeyboardRemove.yaml
      - $ref: ./ForceReply.yaml
