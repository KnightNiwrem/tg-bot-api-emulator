type: object
additionalProperties: false
required:
  - reaction
properties:
  reaction:
    type: array
    minItems: 1
    description: >-
      The reactions the account chooses, which replace its earlier ones, as the Bot API's
      `reaction` lists them. An account without Premium chooses one; more are rejected. Removing
      the account's reactions is a `DELETE` of the same path.
    items:
      type: object
      additionalProperties: false
      description: An ordinary emoji reaction, as the Bot API's `ReactionTypeEmoji` writes it.
      required:
        - type
        - emoji
      properties:
        type:
          type: string
          const: emoji
        emoji:
          type: string
          description: >-
            One of the emoji `ReactionTypeEmoji` lists, written exactly as listed there; any other
            text is refused as `reaction_emoji_unsupported`.
