type: object
additionalProperties: false
properties:
  draft_id:
    type: string
    pattern: '^-?[1-9][0-9]*$'
    description: >-
      The identifier of the draft the test expects the chat to show, in Telegram's decimal text
      form without leading zeros of a nonzero signed 64-bit integer; omitted to act on whichever
      draft it shows. Text of that form beyond the 64-bit range is an `invalid_value` issue. It
      guards which draft the action applies to, not which write to it.
