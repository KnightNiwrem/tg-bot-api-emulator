type: object
additionalProperties: false
description: >-
  A private chat with an account, or with another bot the calling bot knows, as getChat shows
  it. Neither has a bio, photo, birthdate or business profile, so those fields are omitted.
required:
  - id
  - first_name
  - type
  - accepted_gift_types
  - max_reaction_count
  - accent_color_id
properties:
  id:
    $ref: ./TelegramUserId.yaml
  first_name:
    type: string
  last_name:
    type: string
  username:
    type: string
  type:
    type: string
    const: private
  can_send_gift:
    type: boolean
    const: true
    description: Present for an account; a bot can receive no gift.
  active_usernames:
    type: array
    description: The account's username, if it has one, or the bot's.
    items:
      type: string
  has_private_forwards:
    type: boolean
    const: true
    description: Present when the account keeps forwards of its messages from linking to it.
  accepted_gift_types:
    $ref: ./AcceptedGiftTypes.yaml
    description: Every kind of gift for an account; none for a bot.
  pinned_message:
    $ref: ./PinnedPrivateMessage.yaml
    description: >-
      The chat's newest pinned message by sending date. Omitted when the chat pins no message,
      as a chat with another bot never does.
  max_reaction_count:
    type: integer
    description: How many different reactions a message may carry, 11 in every emulated chat.
  accent_color_id:
    type: integer
    description: >-
      The default accent color that TDLib derives from the user or channel identifier, as no
      chat chooses one.
