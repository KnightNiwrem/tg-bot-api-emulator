name: Deno CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.task_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task_name: fmt:check
            task: fmt:check
          - task_name: lint
            task: lint
          - task_name: check
            task: check
          - task_name: test
            task: test
          - task_name: openapi:lint
            task: openapi:lint
          - task_name: openapi:coverage
            task: openapi:coverage
          - task_name: architecture:check
            task: architecture:check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: ${{ matrix.task_name }}
        run: deno task ${{ matrix.task }}
