name: Deno CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.task_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task_name: fmt:check
            task: fmt:check
          - task_name: lint
            task: lint
          - task_name: check
            task: check
          - task_name: test
            task: test
          - task_name: openapi:lint
            task: openapi:lint
          - task_name: openapi:coverage
            task: openapi:coverage
          - task_name: architecture:check
            task: architecture:check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
          # The matrix jobs share one job ID, so the task name keeps each job's cache its own.
          cache-hash: ${{ matrix.task }}-${{ hashFiles('deno.lock', '.dvmrc') }}

      - name: ${{ matrix.task_name }}
        run: deno task ${{ matrix.task }}

      # The frozen lock rejects new or changed dependencies. Deno still restores entries it can
      # derive, such as a missing specifier for a locked package, so any lock change fails the job.
      - name: Lockfile unchanged
        run: git diff --exit-code -- deno.lock
