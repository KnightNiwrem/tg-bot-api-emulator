# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi/paths/sessions_{sessionId}_bot-api_bot{token}_setChatAdministratorCustomTitle.yaml:
  # Bots may set only the titles of administrators they promoted, and bots promote none here, so
  # the method has no success response.
  operation-2xx-response:
    - '#/post/responses'
openapi/components/schemas/MyChatMemberUpdate.yaml:
  # Private-chat and supergroup alternatives differ in the constant `type` of their nested `chat`,
  # which the rule does not inspect, so they are mutually exclusive.
  no-illogical-composition-keywords:
    - '#/properties/my_chat_member/oneOf'
openapi/components/schemas/PrivateMessage.yaml:
  # The alternative requires a property of the enclosing schema, which the rule does not look up.
  no-required-schema-properties-undefined:
    - '#/oneOf/7/required/0'
openapi/components/schemas/SupergroupMessage.yaml:
  # As for PrivateMessage.yaml, the property is defined by the enclosing schema.
  no-required-schema-properties-undefined:
    - '#/oneOf/10/required/0'
